appId: tm.auto.app
---
# Home -> Search -> All filters -> Used -> Show N -> Results -> Back lands on Home.
- tapOn:
    text: "Back"
    optional: true
- extendedWaitUntil:
    visible: "Brand, model"
    timeout: 60000
- assertVisible: "New listings"
- tapOn:
    point: "93%,10%"
- extendedWaitUntil:
    visible: "All filters"
    timeout: 30000
- tapOn: "All filters"
- extendedWaitUntil:
    visible: "Search parameters"
    timeout: 30000
- tapOn: "Used Condition"
- extendedWaitUntil:
    visible: "Show 12 listings"
    timeout: 30000
- takeScreenshot: /tmp/371-ev/32-form-from-all-filters-used-selected
- tapOn: "Show 12 listings"
- extendedWaitUntil:
    visible: "Sort"
    timeout: 30000
- assertNotVisible: "Search parameters"
- assertVisible: "12 listings"
- assertVisible: "Newest first"
- takeScreenshot: /tmp/371-ev/33-results-after-show-n-from-all-filters
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Brand, model"
    timeout: 30000
- assertVisible: "New listings"
- assertNotVisible: "Sort"
- assertNotVisible: "Search parameters"
- assertNotVisible: "All filters"
- takeScreenshot: /tmp/371-ev/34-back-from-results-lands-on-home
