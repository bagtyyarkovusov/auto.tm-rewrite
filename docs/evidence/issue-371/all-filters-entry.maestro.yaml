appId: tm.auto.app
---
# Home -> Search -> All filters -> Search parameters -> Back lands on Home.
- extendedWaitUntil:
    visible: "Brand, model"
    timeout: 60000
- assertVisible: "New listings"
- takeScreenshot: /tmp/371-ev/28-home-before-search
- tapOn:
    point: "93%,10%"
- extendedWaitUntil:
    visible: "All filters"
    timeout: 30000
- takeScreenshot: /tmp/371-ev/29-search-with-keyboard-all-filters
- tapOn: "All filters"
- extendedWaitUntil:
    visible: "Search parameters"
    timeout: 30000
- assertNotVisible: "All filters"
- extendedWaitUntil:
    visible: "Show 12 listings"
    timeout: 30000
- takeScreenshot: /tmp/371-ev/30-search-parameters-keyboard-dismissed
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Brand, model"
    timeout: 30000
- assertVisible: "New listings"
- assertNotVisible: "All filters"
- assertNotVisible: "Search parameters"
- takeScreenshot: /tmp/371-ev/31-back-lands-on-home
