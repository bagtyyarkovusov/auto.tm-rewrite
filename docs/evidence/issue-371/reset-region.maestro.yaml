appId: tm.auto.app
---
- extendedWaitUntil:
    visible: "Search parameters"
    timeout: 60000
- tapOn: "Reset"
- extendedWaitUntil:
    visible: "Show 12 listings"
    timeout: 30000
- tapOn: "Region: Select region"
- tapOn: "Ahal Region"
- extendedWaitUntil:
    visible: "Annau"
    timeout: 30000
- tapOn: "Close"
- assertVisible: "Region: Ahal Region"
- assertVisible:
    text: "City: Select city"
    enabled: true
- takeScreenshot: /tmp/371-24-region-only-before-reset
- tapOn: "Reset"
- assertVisible: "Region: Select region"
- assertVisible:
    text: "City: Select a region first"
    enabled: false
- assertVisible: "Show 12 listings"
- takeScreenshot: /tmp/371-25-region-only-after-reset
- tapOn: "Region: Select region"
- tapOn: "Ahal Region"
- tapOn: "Annau"
- assertVisible: "Region: Ahal Region"
- assertVisible: "City: Annau"
- extendedWaitUntil:
    visible: "Show 0 listings"
    timeout: 30000
- takeScreenshot: /tmp/371-26-city-selected-count
- tapOn: "Reset"
- assertVisible: "Region: Select region"
- assertVisible:
    text: "City: Select a region first"
    enabled: false
- extendedWaitUntil:
    visible: "Show 12 listings"
    timeout: 30000
- takeScreenshot: /tmp/371-27-city-after-reset
