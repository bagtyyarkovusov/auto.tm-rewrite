 ["model","D1 Поддержка: Conversation или отдельный тред?",[["A","Особый Conversation","Conversation без Listing, участник «AutoTM». Тот же сокет, send-путь и push. Но listingId сейчас обязателен и уникален (listingId, buyerId); блок, жалобу и доступность листинга придётся исключать."],["B","★ Отдельный контекст Support","Свои таблицы (тред: User, статус, assignee; сообщения) и своя политика. Инварианты Conversation не трогаем, статус, назначение и закрытие естественны. В списке Messages выглядит так же: UI одинаков."]]],
 ["staff","D2 Как показывать сотрудника",[["A","★ Только «AutoTM» ✓","Один голос, нет утечки имён, нет проблем при смене людей. Автор есть в аудите."],["B","Имя · AutoTM","Теплее, но привязывает людей: нужно имя в профиле и есть проблема при уходе сотрудника."]]],
 ["dir","D3 Направление",[["A","Только входящие + ответы","Сотрудник не пишет первым. Самое безопасное и дешёвое. Карточки уведомлений скрыты."],["B","★ + исходящее одному User","Уведомление об объявлении или аккаунте, ответ на жалобу. Тот же тред, push."],["C","+ рассылки всем","Новости и объявления. Нужны сегменты, очередь, согласие, лимиты, отписка: это отдельный проект."]]],
 ["contact","D4 Где контакты",[["A","★ Шапка + лист ⓘ","Всегда под рукой, чат не засорён. Лист: email, телефон, часы, время ответа."],["B","Закреплённая карточка в треде","Всегда видно, но занимает место."]]],
 ["susp","D5 Ограниченный User (бан)",[["A","★ Чат остаётся открытым","Канал обжалования. Риск спама снимается ограничением треда (сценарий «злоупотребление»)."],["B","Только чтение + email","Проще, но человек, который хочет оспорить, должен писать на почту."]]],
 ["roles","D6 Кто отвечает",[["A","★ moderator + admin","Роли и TOTP уже есть. Реальный автор в аудите."],["B","Новая роль support","Чище права, но миграция enum и проверки в API."],["C","Только admin (основатель)","Ноль настройки, но нет замены на выходные и отпуск."]]],
 ["so","D7 Вход не выполнен",[["A","★ Вход + email/телефон","Чата без аккаунта нет, но «не могу войти» остаётся решаемым через email."],["B","Только «Войти»","Проще, но людям с проблемой входа некуда идти."]]]
];
const decPanel=()=>DEC.map(([k,q,os])=>`<div class="dec"><b class="q">${q}</b>${os.map(([v,n,d])=>`<button class="opt ${V[k]===v?"on":""}" onclick="V.${k}='${v}';render()">${n.replace("★",'<span class="star">★</span>')}<small>${d}</small></button>`).join("")}</div>`).join("");
function est(){const m=V.model,d=V.dir;
 const rows=[
  ["Бэкенд (API, БД)",m==="A"?"L":"M",m==="A"?"миграция Conversation (listingId nullable, kind), исключения в политиках: блок, жалоба, листинг, участники, tombstone":"новый модуль: тред + сообщения, send с идемпотентностью, водяные знаки, статус и assignee"],
  ["Realtime и push (FCM)",m==="A"?"S":"M",m==="A"?"комнаты и FCM-путь уже есть":"новый канал в шлюзе и порт push на той же инфраструктуре"],
  ["Админка: inbox, тред, контекст, назначить, закрыть, аудит","L","новые страницы и серверные действия, маска PII; стиль страницы «Жалобы»"],
  ["Исходящее одному User",d==="A"?"N":"S",d==="A"?"не входит":"форма, шаблоны, причина в аудит"],
  ["Рассылки",d==="C"?"L":"N",d==="C"?"сегменты, очередь worker, лимиты, согласие, отписка, метрики":"не входит"],
  ["Мобильное: строка, тред, лист контактов, карточки","M","общий список Messages, карточки уведомлений, вход из push, состояния"],
  ["Политика и операции",d==="C"?"L":"M","часы, время ответа, штат, шаблоны, правила злоупотребления, Data Safety и приватность, срок хранения"]];
 return {rows,w:(m==="A"?4:3.5)+(d==="B"?.5:d==="C"?2:0)}}
function viab(){const e=est();
 return `<h2>Ваша конфигурация (выбранные D1–D7)</h2><table class="stbl"><tr><th>Часть</th><th>Размер</th><th>Что входит</th></tr>${e.rows.map(r=>`<tr><td>${r[0]}</td><td><span class="sz ${r[1]}">${r[1]}</span></td><td>${r[2]}</td></tr>`).join("")}</table>
 <div class="note"><b>Грубо: ~${e.w.toFixed(1)} нед. для одного разработчика</b> (S ≈ 1–2 дня, M ≈ 3–5, L ≈ 1–2 нед.). Оценка по размеру прототипа, <b>не проверена</b> по коду. Для сравнения: весь релиз #320 оценён в 4–6 недель.</div>
 <h2>Сравнение с вариантом без бэкенда (D10)</h2><table class="stbl"><tr><th></th><th>D10 (план релиза)</th><th>D1-B ★</th><th>D1-A</th></tr><tr><td>Бэкенд</td><td><span class="sz N">0</span></td><td><span class="sz M">M</span></td><td><span class="sz L">L</span></td></tr><tr><td>Админка</td><td><span class="sz N">0</span></td><td><span class="sz L">L</span></td><td><span class="sz L">L</span></td></tr><tr><td>Мобильное</td><td><span class="sz S">S</span></td><td><span class="sz M">M</span></td><td><span class="sz M">M</span></td></tr><tr><td>Риск регрессий чата</td><td>нет</td><td>низкий</td><td>высокий</td></tr><tr><td>Кто отвечает</td><td>почта основателя</td><td>штат в админке</td><td>штат в админке</td></tr></table>
 <h2>Риски</h2><table class="stbl">
 <tr><th>Play UGC</th><td>Тред с сотрудниками не виден другим User, так что Report/Block для него не нужны; они остаются в User-to-User чатах. Нужно отразить сообщения в Data Safety и политике приватности. Позиция Google не проверена.</td></tr>
 <tr><th>Модерация</th><td>Злоупотребление в поддержку: лимит сообщений в сутки, режим «только чтение» с причиной в аудит. Вложений в первой версии нет (хранение, сканирование).</td></tr>
 <tr><th>Штат</th><td>Самый большой риск. Чат без ответа хуже, чем email с честными часами. Нужны 2 человека, шаблоны, обещание времени ответа.</td></tr>
 <tr><th>Push</th><td>FCM только Android (ADR-0047). Push ответа ценен, но расширяет физические проверки #326. Рассылки требуют согласия и лимитов.</td></tr>
 <tr><th>Приватность</th><td>Сотрудники читают переписку: маска PII, чтение в аудит, срок хранения. Удаление (ADR-0032): тред остаётся у AutoTM как «Удалённый пользователь», новый аккаунт получает пустой тред.</td></tr>
 <tr><th>Вход</th><td>Частые обращения «не могу войти» приходят от тех, кто не может войти. Email нужен всегда.</td></tr></table>
 <h2>Рекомендация</h2><div class="note"><b>★ После релиза для проверки Google Play, не до.</b><br>1. Гейт #326 уже требует физический Android FCM, deep link, ревьюерские аккаунты, прод smoke, откат и исправление HTTP-доставки чата. Поддержка добавляет новый канал, админку и штат, которые ревьюер не проверяет.<br>2. D10 (email, телефон при желании) закрывает контакты для Play и #327.<br>3. Пустой или неотвечаемый чат в сборке для ревьюера выглядит хуже честного email.<br>4. Подготовка сейчас почти бесплатна: оставить закреплённую строку Support, использовать лист ⓘ как экран Contact support, выбрать D1-B, чтобы не трогать модель Conversation до релиза.<br>5. Начинать после стабильного чата, исправления HTTP-доставки и когда есть люди для ответов.<br><b>Если основатель хочет до релиза:</b> D1-B, D2-A, D3-A (входящие и ответы), без рассылок и вложений. Примерно 3 нед., релиз сдвигается.</div>
 <div class="note" style="border-color:#aaa"><b>Не проверено:</b> оценки в неделях, позиция Google Play по UGC для чата с сотрудниками, поведение роутера при входе из push, будут ли люди для ответов.</div>`}
function ctlPanel(){return `<h2>Поверхность</h2><div class="seg"><button class="${S.side==="mobile"?"on":""}" onclick="set({side:'mobile'})">Mobile</button><button class="${S.side==="admin"?"on":""}" onclick="set({side:'admin'})">Admin</button></div>
 <div class="note">Состояние общее: сообщение с телефона появляется в админке, ответ из админки приходит на телефон как непрочитанный.</div>
 <h2>Мобильное</h2><span class="lbl">Тема / язык</span><div class="seg"><button class="${S.theme==="light"?"on":""}" onclick="set({theme:'light'})">Light</button><button class="${S.theme==="dark"?"on":""}" onclick="set({theme:'dark'})">Dark</button></div><div class="seg">${["ru","en","tk"].map(l=>`<button class="${S.lang===l?"on":""}" onclick="set({lang:'${l}'})">${l.toUpperCase()}${l==="tk"?" (draft)":""}</button>`).join("")}</div>
 <span class="lbl">Сеть / часы</span><div class="seg"><button class="${S.net==="on"?"on":""}" onclick="set({net:'on'})">Online</button><button class="${S.net==="off"?"on":""}" onclick="set({net:'off'})">Offline</button></div><div class="seg"><button class="${S.hours==="in"?"on":""}" onclick="set({hours:'in'})">Рабочее время</button><button class="${S.hours==="out"?"on":""}" onclick="set({hours:'out'})">Нерабочее</button></div>
 <h2>Сценарии (прыжок)</h2>${Object.entries(SC).map(([k,v])=>`<div><button class="ab" style="width:100%;text-align:left;margin:2px 0" onclick="loadSc('${k}')">${v.label}</button></div>`).join("")}
 <div class="note"><b>Что видно:</b> ${S.note||"Выберите сценарий."}</div>
 <button class="ab" onclick="simReply()">Ответить от поддержки (как из админки)</button>
 <h2>Отличие от User-to-User</h2><table class="stbl"><tr><th></th><th>Поддержка</th><th>Чат с продавцом</th></tr><tr><td>Аватар</td><td>знак ATM + ✓</td><td>фото объявления</td></tr><tr><td>Положение</td><td>закреплён сверху</td><td>по времени</td></tr><tr><td>Плашка</td><td>«Официальный»</td><td>роль, «Продано»</td></tr><tr><td>Меню</td><td>Контакты, Mute</td><td>Mute, Report, Block</td></tr><tr><td>Листинг</td><td>нет</td><td>всегда</td></tr></table>`}
function sidePanel(){const tabs=[["controls","Сцены"],["decisions","Решения ★"],["viab","Viability"],["about","О прототипе"]];
 const body=S.stab==="controls"?ctlPanel():S.stab==="decisions"?`<div class="note">★ = рекомендация. Выбор сразу меняет оба экрана.</div>`+decPanel():S.stab==="viab"?viab():`<div class="note">Прототип для #500. Основан на утверждённых D1–D10 из #352 (D10: строка Support и экран Contact support). Email: <b>${SUPPORT_EMAIL}</b>. Телефон, часы, время ответа и срок хранения это <span class="ph-x">заполнители</span>.</div><div class="note">Не включено: вложения, оценка ответа, бот, поиск по inbox, таймеры SLA. Домен: глоссарий определяет Conversation как разговор покупателя и продавца про Listing, поэтому поддержка потребует правки глоссария (Message уже допускает автора «AutoTM»).</div>`;
 return `<h1>Поддержка в приложении <small style="font-weight:400;color:#737373">#500 · прототип</small></h1><div class="tabs">${tabs.map(([k,n])=>`<button class="${S.stab===k?"on":""}" onclick="set({stab:'${k}'})">${n}</button>`).join("")}</div>${body}`}

/* ================= render ================= */
function render(){const ae=document.activeElement;const aid=ae&&ae.id;
 const side=document.getElementById("side");const sc=side.scrollTop;side.innerHTML=sidePanel();side.scrollTop=sc;
 const st=document.getElementById("stage");
 st.innerHTML=S.side==="mobile"?mobile():`<div id="zoomer">${admin()}</div>`;
 if(S.side==="admin")st.firstChild.style.zoom=Math.min(1,(window.innerWidth-380-60)/1180);
 const mb=document.getElementById("mbody");if(mb)mb.scrollTop=mb.scrollHeight;
 const ab=document.getElementById("abody");if(ab)ab.scrollTop=ab.scrollHeight;
 if(aid){const el=document.getElementById(aid);if(el){el.focus();if(el.setSelectionRange&&el.value)try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}}
window.addEventListener("resize",render);
loadSc("active");
const q=new URLSearchParams(location.search);
if(q.get("v"))q.get("v").split(",").forEach(p=>{const[a,b]=p.split(":");V[a]=b});
if(q.get("s"))loadSc(q.get("s"));if(q.get("side"))S.side=q.get("side");if(q.get("stab"))S.stab=q.get("stab");if(q.get("theme"))S.theme=q.get("theme");if(q.get("lang"))S.lang=q.get("lang");if(q.get("sel"))S.adminSel=q.get("sel");if(q.get("sheet"))S.sheet=q.get("sheet");if(q.get("compose"))openCompose("t1");render();
</script>
