function bubble(x,i){
 const me=x.m==="me";const rep=S.reported[i];
 const lp=me?"":`onclick="longPress(${i})"`;
 let foot="";
 if(me&&x.st==="pending")foot=`<div class="meta">${t("sending")}</div>`;
 else if(me&&x.st==="failed")foot=V.fail==="A"?`<div class="meta" style="opacity:1">⚠ ${t("failed")} · <span style="text-decoration:underline;cursor:pointer;font-weight:700" onclick="event.stopPropagation();retryMsg(${i})">↻ ${t("retry")}</span></div>`:`<div class="meta" style="opacity:1">⚠ ${t("failed")}</div>`;
 else if(me)foot=`<div class="meta">${x.tm} ${tick(x.st)}</div>`;
 else foot=`<div class="meta" style="justify-content:flex-start;color:var(--mfg)">${x.tm}${rep?' · '+t('reported'):''}</div>`;
 const tap=(me&&x.st==="failed"&&V.fail==="B")?`onclick="set({sheet:'failed',sel:${i}})" style="cursor:pointer"`:"";
 const lastMe=thread.map((y,j)=>y.m==="me"?j:-1).reduce((a,b)=>Math.max(a,b),-1);
 const showRead=V.read==="B"&&me&&x.st==="read"&&i===lastMe;
 return `<div style="display:flex;padding:2px 14px;flex-direction:column;align-items:${me?'flex-end':'flex-start'}"><div class="bub ${me?'me':'peer'}" ${lp} ${tap} style="${rep?'opacity:.6;':''}${x.st==='pending'?'opacity:.7':''}">${x.txt}${foot}</div>${showRead?`<span class="xs mute" style="margin:2px 4px">${t("readLbl")}</span>`:''}</div>`}

 if(!txt||!txt.trim()||S.blocked)return;const m={m:"me",txt:txt,st:"pending",tm:"18:55"};thread.push(m);S.draft="";render();
 setTimeout(()=>{m.st=S.net==="off"?"failed":"sent";render()},900);
 if(S.net!=="off")setTimeout(()=>{m.st="delivered";render()},1800);
 if(S.net!=="off")setTimeout(()=>{m.st="read";render()},3200);
}

 else mid=`<div class="dsep">${t("today")}</div>`+thread.map(bubble).join("");
 const soldBanner=(sc==="sold"&&V.sold==="B")?`<div style="margin:10px 14px;padding:10px 12px;border-radius:10px;background:var(--secondary);font-size:12.5px">ⓘ ${t("soldBanner")}<div style="margin-top:6px;color:var(--primary);cursor:pointer" onclick="toast('Opens Results filtered by brand and model')">${t("seeOther")} ›</div></div>`:"";
 const blockedBanner=S.blocked?`<div style="padding:12px 14px;border-top:1px solid var(--border);background:var(--muted);display:flex;gap:10px;align-items:center;flex:none"><div style="flex:1"><div class="sm" style="font-weight:600">${t("blkTitle")}</div><div class="xs mute">${t("blkDesc")}</div></div><button class="btn out sm" style="border:1px solid var(--border)" onclick="set({dialog:'unblock'})">${t("unblock")}</button></div>`:"";
 const qr=qrShow()?`<div style="display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;flex:none;scrollbar-width:none">${["qAvail","qSee","qPrice","qCond"].map(k=>`<span class="chip" onclick="send(t('${k}'))">${t(k)}</span>`).join("")}</div>`:"";
 const closed=sc==="sold"&&V.sold==="C";
 const comp=(S.blocked&&V.blk==="B")?"":closed?`<div style="padding:12px 14px;border-top:1px solid var(--border);text-align:center;font-size:12.5px;color:var(--mfg)">${t("soldClosed")}</div>`:`<div class="composer"><span class="mute">📎</span><input id="inp" placeholder="${t("msgPh")}" value="${S.draft.replace(/"/g,'&quot;')}" ${S.blocked?'disabled':''} oninput="S.draft=this.value" onkeydown="if(event.key==='Enter')send(S.draft)"><button class="ib" style="color:var(--primary)" ${S.blocked?'disabled':''} onclick="send(S.draft)">➤</button></div>`;
 return `${head}${strip()}<div class="body" id="tb">${mid}${soldBanner}</div>${blockedBanner}${qr}${comp}`}

/* ───────── push ───────── */
function pushScreen(){
 if(S.pushStage==="signin")return `<div class="center"><div class="circle">🔒</div><b>${t("pushSigned")}</b><button class="btn brand" onclick="S.pushSigned=true;openThread('active','push')">${t("signIn")}</button></div>`;
 return `<div class="lock"><div style="text-align:center;font-size:56px;font-weight:300">09:41</div><div style="text-align:center;opacity:.7;margin-bottom:30px">Пятница, 2 октября</div>
 <div class="notif" onclick="${S.pushSigned?"openThread('active','push')":"set({pushStage:'signin'})"}"><div class="xs" style="opacity:.8">AutoTM · сейчас</div><b>${t("pushTitle")}</b><div class="sm">${t("pushBody")}</div></div>
 <div class="xs" style="opacity:.6;margin-top:14px;text-align:center">Tap the notification. Cold start, background and foreground all route to /conversations/{id}.</div></div>`}

/* ───────── overlays ───────── */
function overlays(){
 let h="";
 if(S.sheet==="menu"){
  const it=(i,l,fn,col)=>`<div class="it" ${col?'style="color:var(--destructive)"':''} onclick="${fn}"><span>${i}</span>${l}</div>`;
  const mu=it("🔕",S.muted?t("unmute"):t("mute"),"set({muted:!S.muted,sheet:null})");
  const rp=it("⚠",t("report"),"set({sheet:'report',sel:null,reportReason:null})");
  const bl=it("⛔",S.blocked?t("unblock"):t("block"),S.blocked?"set({sheet:null,dialog:'unblock'})":"set({sheet:null,dialog:'block'})",1);
  const sp=it("🛟",t("contactSupport"),"openSupport('thread')");
  const dl=it("🗑",t("delConv"),"set({sheet:null});toast('Conversation deleted for you')",1);
  h+=`<div class="dim" onclick="set({sheet:null})"></div><div class="sheet">${V.menu==="A"?mu+bl+sp:V.menu==="B"?mu+rp+bl+dl+sp:mu+rp+bl+sp}</div>`}
 if(S.sheet==="msg")h+=`<div class="dim" onclick="set({sheet:null})"></div><div class="sheet"><div class="it" onclick="set({sheet:null});toast('Copied')"><span>⧉</span>${t("copy")}</div><div class="it" style="color:var(--destructive)" onclick="set({sheet:'report',reportReason:null})"><span>⚑</span>${t("reportMsg")}</div><div class="it" onclick="set({sheet:null})"><span>✕</span>${t("cancel")}</div></div>`;
 if(S.sheet==="failed")h+=`<div class="dim" onclick="set({sheet:null})"></div><div class="sheet"><div class="it" onclick="set({sheet:null});retryMsg(S.sel)"><span>↻</span>${t("retryDel")}</div><div class="it" style="color:var(--destructive)" onclick="thread.splice(S.sel,1);set({sheet:null})"><span>🗑</span>${t("delMsg")}</div></div>`;
 if(S.sheet==="report"){
  const R=["spam","scam","mislead","harass","other"];
  if(S.reportReason==="done")h+=`<div class="dim"></div><div class="sheet" style="text-align:center"><div style="font-size:30px">✓</div><b>${t("thanks")}</b><div style="margin-top:12px"><button class="btn brand" onclick="${S.sel!=null?`S.reported[S.sel]=1;`:''}set({sheet:null,reportReason:null})">${t("done")}</button></div></div>`;
  else h+=`<div class="dim" onclick="set({sheet:null})"></div><div class="sheet"><b>${S.sel!=null?t('reportMsg'):t('report')}</b><div class="xs mute" style="margin-bottom:6px">${t("selReason")}</div>${R.map(r=>`<div class="it" onclick="set({reportReason:'${r}'})"><span style="width:18px;height:18px;border-radius:50%;border:2px solid ${S.reportReason===r?'var(--primary)':'var(--border)'};background:${S.reportReason===r?'var(--primary)':'none'};flex:none"></span>${t(r)}</div>`).join("")}${S.reportReason==="other"?`<input placeholder="${t("describe")}" style="width:100%;margin:6px 0;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--muted);color:var(--fg)">`:''}<button class="btn brand" style="width:100%;margin-top:8px" ${S.reportReason?'':'disabled'} onclick="set({reportReason:'done'})">${t("submit")}</button></div>`}
 if(S.dialog){const b=S.dialog==="block";h+=`<div class="dim"></div><div class="dlg"><b>${t(b?'blkConfT':'unblkConfT')}</b><div class="sm mute" style="margin:8px 0 14px">${t(b?'blkConfD':'unblkConfD')}</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn out sm" onclick="set({dialog:null})">${t("cancel")}</button><button class="btn brand sm" onclick="set({blocked:${b},dialog:null})">${t(b?'block':'unblock')}</button></div></div>`}
 return h}

/* ───────── panel ───────── */
const seg=(label,items)=>`<div><span class="lbl">${label}</span><span class="seg">${items.map(([on,js,n])=>`<button class="${on?'on':''}" onclick="${js}">${n}</button>`).join("")}</span></div>`;
function panel(){
 const s=S.surface;
 let h=`<h1>Favorites and Conversations · prototype (#352)</h1><div class="xs" style="color:#737170">Throwaway. Tokens from apps/mobile/global.css. D1-D9 are founder-APPROVED (2026-10-02, all recommended options, shown by default; ✓ marks the approved option, the other toggles are kept only for comparison). D10 contact support is new and awaits sign-off (red = shown, ★ = recommended).</div>`;
 h+=`<h2>Global</h2>`+seg("Surface",[["fav","fav"],["msgs","msgs"],["thread","thread"],["push","push"],["support","support"]].map(([v])=>[s===v,v==="thread"?"openThread(S.thread,'tab',S.blocked)":v==="support"?"openSupport(S.supFrom)":v==="push"?"set({surface:'push',pushStage:'lock',tab:'msgs'})":`set({surface:'${v}',tab:'${v}'})`,{fav:"Favorites",msgs:"Messages list",thread:"Conversation",push:"Push entry",support:"Contact support"}[v]]))+
  seg("Theme",[[!S.dark,"set({dark:false})","Light"],[S.dark,"set({dark:true})","Dark"]])+
  seg("Language",["ru","en","tk"].map(l=>[LANG===l,`LANG='${l}';initThread();render()`,l.toUpperCase()]));
 if(s==="fav")h+=`<h2>Favorites state</h2>`+seg("State",[["list","List"],["loading","Loading"],["error","Error"],["empty","Empty"],["signedout","Signed out"]].map(([v,n])=>[S.fav===v,`set({fav:'${v}'})`,n]))+
  `<div class="note">Settled in #351 (AR-36-001/002): large card with Call and Message, filled ♥ removes with Undo, <b>Hide sold</b> on by default with a hidden count. Switch Hide sold off on the phone to see Sold and Removed from sale dimmed, without contact buttons. Tap ♥ on both active cards that remain to reach “No active listings”. The Niva has no Message button (allowChat off). Deleted and banned Listings never appear. No recommendations block.</div>
  <button class="btn out sm" onclick="favs=FAV.map(x=>({...x}));S.fav='list';S.hideSold=true;render()">Reset list</button>`;
 if(s==="msgs")h+=`<h2>Messages list state</h2>`+seg("State",[["list","List"],["loading","Loading"],["error","Error"],["empty","Empty"],["signedout","Signed out"]].map(([v,n])=>[S.msgs===v,`set({msgs:'${v}'})`,n]))+`<div class="note">Rows show: unread badge with bold preview, muted bell, own last Message with tick, a Conversation about a sold Listing (badge), a blocked user (preview replaced). Tap a row to open it. The Auto.ru support-chat card (AR-37-005) and ads (KZ-49-002) are left out on purpose (D8). The pinned <b>Support</b> row (D10) is different: it has the AutoTM mark, no unread badge, and opens contact details, not a chat. Use the floating bar D10 to compare it with a header Help icon. Empty and Error states show a “Need help? Contact support” link; the Signed-out state keeps the Support row.</div>`;
 if(s==="thread")h+=`<h2>Conversation state</h2>`+seg("Scenario",[["new","New (empty)"],["active","Active"],["sold","Sold Listing"],["loading","Loading"],["error","Error"],["signedout","Signed out"]].map(([v,n])=>[S.thread===v,`scen('${v}')`,n]))+
  seg("Network",[[S.net==="ok","set({net:'ok'})","Online"],[S.net==="off","set({net:'off'})","Offline: sends fail"]])+
  seg("Blocked",[[!S.blocked,"set({blocked:false})","No"],[S.blocked,"set({blocked:true})","Blocked banner"]])+
  `<div class="note">Try it: type and Send (Sending, ✓, ✓✓, Read). Go Offline and send for a failed Message, then go Online and Retry. Click a seller Message to Report it. ⋯ opens the menu. Quick replies show in the New scenario. No prepayment warnings.</div>`;
 if(s==="push")h+=`<h2>Push entry</h2>`+seg("Signed in",[[S.pushSigned,"set({pushSigned:true,pushStage:'lock'})","Yes"],[!S.pushSigned,"set({pushSigned:false,pushStage:'lock'})","No (session expired)"]])+`<div class="note">Tap the notification. Signed in: opens the Conversation. Signed out: sign-in, then the same Conversation. Back behaviour is decision D9.</div>`;
 if(s==="support")h+=`<h2>Contact support (D10)</h2>`+seg("Opened from",[["msgs","Messages"],["fav","Favorites"],["thread","Conversation ⋯"]].map(([v,n])=>[S.supFrom===v,`S.supFrom='${v}';render()`,n]))+`<div class="note"><b>Founder to supply (placeholders in yellow):</b> the support email (<code>support@&lt;to-confirm&gt;</code>), the phone (<code>+993 XX XXX XXX</code>), the real support hours, and the response-time promise. The web Trust page still shows trust@auto.tm, a domain the founder does not control. No in-app support chat in this release (needs a support User, admin reply tooling and moderation). Email opens <code>mailto:</code>, Call opens <code>tel:</code>. Entry points: pinned Support row, Messages and Favorites empty and error links, Conversation ⋯ menu.</div>`;
 h+=`<h2>Exists today vs new</h2>`+status();
 document.getElementById("panel").innerHTML=h}
function status(){
 const rows={fav:[["Large card, Call + Message, ♥ with Undo, Hide sold, Sold / Removed labels","New (today a plain ListingCard, no actions, no switch)"],["Signed-out, empty, skeleton, error","Exist in app/(tabs)/favorites.tsx; copy changes"],["“Need help? Contact support” link in empty and error states","New"]],
 support:[["Contact support screen: Email us (mailto:), Call us (tel:), hours, what to include, response-time note","New (no support contact anywhere in the mobile app today; web Trust page shows trust@auto.tm)"],["Support email, phone, hours, response time","Founder to supply (placeholders shown)"],["RU/EN/TK copy","New; TK is a draft"]],
 msgs:[["List, unread badge, role label, sold label, empty, skeleton, error, signed-out","Exist (ConversationList.tsx, ConversationListItem.tsx, app/(tabs)/chat.tsx)"],["Seller name, tick, muted and blocked marks on the row","New"],["Pinned Support row (AutoTM mark, no badge; signed-in, empty, signed-out) or header Help icon (D10)","New"],["“Need help? Contact support” link in Messages empty and error states","New"]],
 thread:[["Pinned Listing strip, quick replies, Sending/Failed/Retry, ticks, Report message, Block/Unblock, blocked banner, Mute","Exist (app/conversations/[id].tsx, MessageBubble.tsx, QuickReplies.tsx, ConversationListingCard.tsx, MessageReportSheet.tsx)"],["Sold banner, Report user, Read label, Copy (no Delete conversation: D2 approved)","New"],["“Contact support” item in the ⋯ menu, after Mute, Report, Block","New"]],
 push:[["Tap routes to the Conversation (cold, background, foreground)","Exists (src/notifications/useDirectMessagePushRouting.ts)"],["Messages list under the Conversation, signed-out return","New, unverified"]]}[S.surface];
 return `<table><tr><th>State</th><th>Today</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><div class="xs" style="color:#737170;margin-top:6px">${Object.keys(I).filter(k=>I[k].n).length} strings are new; their TK text is a draft to be checked.</div>`}

/* ───────── floating bar ───────── */
function bar(){
 const d=D[di];
 document.getElementById("switcher").innerHTML=`<div class="top"><button onclick="cycle(-1)">←</button><span>${d.n}${d.ap?` <span style="color:#7ee2a0;font-size:11.5px">✓ approved ${APPROVED}</span>`:' <span style="color:#ffd27a;font-size:11.5px">proposal</span>'}</span><button onclick="cycle(1)">→</button><button style="padding:0 12px" onclick="jump()">show</button></div><div class="opts">${d.o.map(([k,n,rec])=>`<button class="${V[d.k]===k?'on':''}" onclick="setV('${d.k}','${k}')">${k}${rec?(d.ap?' ✓':' ★'):''} · ${n}</button>`).join("")}</div>`}
function cycle(n){di=(di+n+D.length)%D.length;jump()}
function jump(){
 const p=D[di].go();
 if(p.thread){S.thread=p.thread;S.blocked=!!p.blocked;S.sheet=null;S.dialog=null;S.net=p.net||"ok";S.from="tab";S.reported={};initThread();
   if(p.addFailed)thread.push({m:"me",txt:t("m7"),st:"failed",tm:"18:55"});}
 delete p.thread;delete p.blocked;delete p.net;delete p.addFailed;
 set(Object.assign({sheet:null},p))}
function render(){
 document.getElementById("phone").className="phone"+(S.dark?" dark":"");
 const scr={fav:favScreen,msgs:msgsScreen,thread:threadScreen,push:pushScreen,support:supportScreen}[S.surface]();
 document.getElementById("screen").innerHTML=`<div class="screen">${scr}${overlays()}${toastEl()}</div>`;
 const tb=document.getElementById("tb");if(tb)tb.scrollTop=tb.scrollHeight;
 const inp=document.getElementById("inp");if(inp&&document.activeElement===document.body&&S.draft){inp.focus();inp.setSelectionRange(S.draft.length,S.draft.length)}
 panel();bar()}
initThread();render();
</script>
</body>
</html>
