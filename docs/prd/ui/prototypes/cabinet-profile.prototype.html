  Question: what do Cabinet, Profile, Settings, Delete account and the phone-or-email sign-in screens look like in every state?
  Respects: #344 (five tabs; Cabinet → Profile, My listings, Settings; Settings holds language, theme, legal, Log out,
  Delete account), #348 / ADR-0054 (Sign-in Methods optional, unique, always verified; add/change by code; can change
  but not remove; a taken value is refused after the code is confirmed, never merged; DELETE /me unchanged; neutral
  web deletion copy), ADR-0056 (supersedes ADR-0054's "Add a phone" sell step and PHONE_REQUIRED: every Listing's
  contact phone is verified in the Sell wizard, email-only Users sell without an account phone), ADR-0055 (email
  codes, 10-minute expiry), ADR-0032 (30-day grace deletion, recoverable by signing in), #322/#496 (legal and
  deletion pages on autotm.bagtyyar.dev), #352 D10 + #500 (Contact support screen: phone and email, chat after
  release), #326 (no dead actions).
  RECONCILED 2026-10-02: founder approved D2 = A (Phone | Email tabs). Options that conflicted with approved
  decisions were removed; see the "Conflicts resolved" panel.
  No share affordances (#495). Account values and demo codes are made up. Support contacts are the founder-approved public contacts.
  Colours are AutoTM tokens from apps/mobile/global.css (light and dark). Not Auto.ru's look; Auto.ru/Kolesa are structure references only.
  RU/TK strings marked "draft" in the state list are new and need a native-speaker review.

const t=(k,v)=>{const a=TX[k];if(!a)throw new Error("Missing translation: "+k);let s=a[LANGS.indexOf(S.lang)];if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s;};

/* ───────────── state ───────────── */
const S={
  webProfile:"production", acct:"out", phone:"+993 61 00-00-00", email:"name@example.com",   // all fake
  lang:"en", theme:"light", os:false,
  stack:[{id:"cabinet"}], tab:"cabinet",
  v:{cab:"B",entry:"A",sell:"A",set:"A",chg:"B",taken:"A",del:"A"},
  dec:"cab", data:"ok", outcome:"ok", req:"ok", delOut:"ok",
  flow:null, ret:null, toast:null, sheet:null, dlg:null, web:null, delChecked:false,
  notif:{msg:true,act:true,os:"granted"}, picker:null, name:null,
};
const hasPhone=()=>S.acct==="phone"||S.acct==="both", hasEmail=()=>S.acct==="email"||S.acct==="both", signed=()=>S.acct!=="out";

const maskPhone=p=>p.replace(/^(\+993 \d)\d( )\d\d-\d\d-(\d\d)$/,"$1• ••-••-$3").replace(/^(\+993 6)(\d)/,"$1•");
const maskPhoneDisp=p=>{const raw=p.replace(/\D/g,"");const d=raw.startsWith("993")?raw.slice(3):raw;return "+993 "+d[0]+"• ••-••-"+d.slice(-2);};
const maskEmail=e=>{const [a,b]=e.split("@");return a[0]+"•••@"+b;};
const dest=(type,val)=>type==="phone"?maskPhoneDisp(val):maskEmail(val);
const topScreen=()=>S.stack[S.stack.length-1];
const TABS=["search","favorites","sell","messages","cabinet"];
const isTab=id=>TABS.includes(id);
const fmtPhone=d=>(d=d.replace(/\D/g,"").slice(0,8),d.length>6?d.slice(0,2)+" "+d.slice(2,4)+"-"+d.slice(4,6)+"-"+d.slice(6):d.length>4?d.slice(0,2)+" "+d.slice(2,4)+"-"+d.slice(4):d.length>2?d.slice(0,2)+" "+d.slice(2):d);
const validPhone=v=>{const d=v.replace(/\D/g,"");return d.length===8&&d[0]==="6";};
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

/* ───────────── navigation ───────────── */
function push(id,p={}){S.stack.push({id,...p});render();}
function pop(){if(S.stack.length>1)S.stack.pop();render();}
function reset(tab){S.tab=tab;S.stack=[{id:tab}];S.sheet=S.dlg=null;render();}
function toast(m){S.toast=m;render();clearTimeout(window._t);window._t=setTimeout(()=>{S.toast=null;render();},2400);}
function startSignIn(){S.ret=S.stack.slice();S.flow={kind:"signin",type:"phone",val:"",err:null,step:"entry"};push("signin");}
function closeSignIn(){S.stack=S.ret||[{id:"cabinet"}];S.flow=null;render();}
function startMethod(kind,type){S.flow={kind,type,val:"",err:null,step:"entry",back:S.stack.slice()};push("methodEntry");}
function switchTab(tab){if(S.tab===tab){reset(tab);return;}S.histories=S.histories||{};S.histories[S.tab]=S.stack.slice();S.tab=tab;S.stack=S.histories[tab]||[{id:tab}];S.sheet=S.dlg=S.web=S.picker=null;render();}
const webBase=()=>S.webProfile==="staging"?"https://staging.autotm.bagtyyar.dev":"https://autotm.bagtyyar.dev";
function openLegal(kind){S.web={kind};render();}

/* ───────────── flows ───────────── */
function detect(v){return /^[+\d\s()-]+$/.test(v)&&v.replace(/\D/g,"").length>0?"phone":"email";}
function liveVal(el){
  const f=S.flow;let v=el.value;
  if(f.type==="phone"){v=fmtPhone(v.replace(/^\+?993/,""));el.value=v;}
  f.val=v;f.err=null;
}
function demoFill(){const f=S.flow;f.val=f.type==="phone"?"60 00-00-00":"name@example.com";f.err=null;render();}
function getCode(){
  const f=S.flow;let type=f.type;
  let val=f.val.trim();
  const phoneish=type==="phone";
  const ok=phoneish?validPhone(val):validEmail(val);
  if(!ok){f.err="invalid";f.type=type;render();return;}
  const r=S.req;S.req="ok";
  if(r==="offline"){f.err="offline";render();return;}
  if(r==="rate"){f.err="rate";render();return;}
  if(r==="rateDay"){f.err="rateDay";render();return;}
  f.type=type;f.val=phoneish?val:val.toLowerCase();f.err=null;f.code="";f.cerr=null;f.sec=15;f.resends=0;f.nomail=false;
  if(f.kind==="webdelete"){f.step="code";render();}else push("code");
}
function key(d){
  const f=S.flow;if(!f||["locked","expired","rateDay"].includes(f.cerr)||f.busy)return;
  f.code=f.code||"";
  if(d==="<"){f.code=f.code.slice(0,-1);f.cerr=null;render();return;}
  if(f.code.length>=6)return;
  f.code+=d;f.cerr=null;render();
  if(f.code.length===6){f.busy=true;setTimeout(submitCode,350);}
}
function submitCode(){
  const f=S.flow;if(!f)return;f.busy=false;
  let o=S.outcome;S.outcome="ok";
  if(o==="taken"&&!(f.kind==="add"||f.kind==="change"))o="ok";
  if(o==="grace"&&f.kind!=="signin")o="ok";
  if(o==="wrong"||o==="expired"||o==="locked"||o==="offline"){f.cerr=o;f.code="";render();return;}
  if(o==="taken"){S.stack.pop();push("taken");return;}
  success(o==="grace");
}
function success(grace){
  const f=S.flow;
  if(f.kind==="signin"){
    const previous=S.savedAccount;const same=previous&&(f.type==="phone"?previous.phone.replace(/\D/g,"")===('993'+f.val.replace(/\D/g,"")):previous.email===f.val);
    S.acct=same?previous.acct:f.type==="phone"?"phone":"email";
    if(f.type==="phone")S.phone=f.val.startsWith("+")?f.val:"+993 "+f.val;else S.email=f.val;
    S.savedAccount={acct:S.acct,phone:S.phone,email:S.email};S.stack=S.ret;S.flow=null;
    if(grace||S.deletionPending){S.restoreAcct=S.deletedAcct||S.acct;S.acct="out";S.dlg="restore";render();}else toast(t("signedIn"));
  }else if(f.kind==="add"||f.kind==="change"){
    if(f.type==="phone")S.phone="+993 "+f.val;else S.email=f.val;
    S.acct=f.type==="phone"?(hasEmail()?"both":"phone"):(hasPhone()?"both":"email");S.savedAccount={acct:S.acct,phone:S.phone,email:S.email};S.stack=f.back;S.flow=null;toast((f.kind==="add"?t("added"):t("changed"))+": "+dest(f.type,f.type==="phone"?S.phone:S.email));
  }else if(f.kind==="webdelete"){f.step="done";render();}
}
function resend(){
  const f=S.flow;if(f.sec>0)return;
  const r=S.req;S.req="ok";
  if(r==="rateDay"||f.resends>=4){f.cerr="rateDay";render();return;}
  if(r==="rate"){f.cerr="rate";render();return;}
  if(r==="offline"){f.cerr="offline";render();return;}
  f.resends++;f.sec=15;f.code="";f.cerr=null;toast(t("otpSent",{d:dest(f.type,f.val)}));
}
function backFromCode(){const f=S.flow;f.code="";f.cerr=null;if(f.kind==="webdelete"){f.step="entry";render();}else if(f.kind==="delete"){S.flow=null;pop();}else pop();}
setInterval(()=>{const f=S.flow;if(f&&f.sec>0&&(topScreen().id==="code"||(topScreen().id==="webDelete"&&f.step==="code"))){f.sec--;renderPhone();}},1000);

function doDelete(){
  S.dlg=null;const o=S.delOut;S.delOut="ok";
  if(o==="fail"){S.delFailed=true;render();return;}
  S.delFailed=false;
  S.histories={};S.savedAccount={acct:S.acct,phone:S.phone,email:S.email};S.deletedAcct=S.acct;S.deletionPending=true;S.acct="out";S.stack=[{id:"cabinet"}];S.tab="cabinet";S.flow=null;push("scheduled");
}
function doLogout(){S.histories={};S.savedAccount={acct:S.acct,phone:S.phone,email:S.email};S.dlg=null;S.acct="out";reset("cabinet");toast({en:"Signed out",ru:"Вы вышли",tk:"Çykyldy"}[S.lang]);}
function restore(){S.acct=S.restoreAcct||S.acct;S.deletionPending=false;S.dlg=null;toast({en:"Account restored. Your Listings are back.",ru:"Аккаунт восстановлен. Объявления снова активны.",tk:"Hasap dikeldildi. Bildirişler gaýdyp geldi."}[S.lang]);}
function restoreCancel(){S.dlg=null;S.acct="out";render();}

/* ───────────── building blocks ───────────── */
const ic={back:"←",x:"✕",gear:"⚙",chev:"›"};
function appbar(title,o={}){return `<div class="appbar">${o.noBack?"":`<button class="ib" aria-label="Back" onclick="${o.back||"pop()"}">${ic.back}</button>`}<div class="t" ${o.noBack?"":'style="font-size:18px;font-family:inherit"'}>${title||""}</div>${o.right||""}</div>`;}
function btn(label,fn,cls="brand",dis=false){return `<button class="btn ${cls}" ${dis?"disabled":""} onclick="${fn}">${label}</button>`;}
function skeletonLines(){return `<div class="pad" style="padding-top:14px"><div class="skel" style="height:64px;width:64px;border-radius:50%"></div><div class="skel" style="height:18px;width:50%;margin-top:12px"></div><div class="skel" style="height:90px;margin-top:14px;border-radius:12px"></div><div class="skel" style="height:90px;margin-top:12px;border-radius:12px"></div></div>`;}
function errState(){return `<div class="pad" style="text-align:center;padding-top:80px"><div style="font-size:34px">⚠</div><div class="b" style="font-size:17px;margin:8px 0">${t("wrong")}</div><div class="mute sm" style="margin-bottom:16px">${t("offline")}</div><div style="max-width:180px;margin:auto">${btn(t("retry"),"S.data='ok';render()","out")}</div></div>`;}
function avatar(sz,name){return `<div class="av" style="width:${sz}px;height:${sz}px;font-size:${sz/2.4}px">${name?name[0].toUpperCase():"👤"}</div>`;}
function idLabel(){return hasPhone()?maskPhoneDisp(S.phone):maskEmail(S.email);}
function methodRow(type){
  const has=type==="phone"?hasPhone():hasEmail();
  const val=has?(type==="phone"?maskPhoneDisp(S.phone):maskEmail(S.email)):null;
  const act=has?t("change"):t("add");
  const fn=has&&S.v.chg==="B"?`S.sheet={t:'chg',type:'${type}'};render()`:`startMethod('${has?"change":"add"}','${type}')`;
  return `<div class="row" role="button" aria-label="${t(type)}, ${val||t("notAdded")}. ${act}" onclick="${fn}"><div class="l"><div class="mute sm">${t(type)}</div>${val?`<div class="b" style="font-size:16px">${val}</div><div class="badge ver" style="margin-top:2px">✓ ${type==="phone"?t("phoneVer"):t("verified")}</div>`:`<div class="mute" style="font-size:16px">${t("notAdded")}</div>`}</div><span class="b sm">${act}</span><span class="chev">${ic.chev}</span></div>`;
}
function legalLinks(){return `<div class="xs mute" style="padding:0 16px 14px">${t("legalPre")} <a style="color:var(--info);text-decoration:underline" onclick="openLegal('terms')">${t("terms")}</a> ${t("and")} <a style="color:var(--info);text-decoration:underline" onclick="openLegal('privacy')">${t("privacy")}</a>.</div>`;}
function langSwitch(){return `<div style="display:flex;gap:4px">${LANGS.map(l=>`<button class="badge" style="cursor:pointer;${S.lang===l?"background:var(--fg);color:var(--bg)":""}" onclick="S.lang='${l}';render()">${l.toUpperCase()}</button>`).join("")}</div>`;}

/* ───────────── screens ───────────── */
function listingsBlock(){return {a:2,d:1,s:0,r:1};}
function cabinetScreen(){
  const v=S.v.cab;const gear=`<button class="ib" aria-label="${t("settings")}" onclick="push('settings')">${ic.gear}</button>`;
  let h=`<div class="appbar"><div class="t">${t("cabinet")}</div>${gear}</div>`;
  if(S.data==="loading"&&signed())return h+skeletonLines();
  if(S.data==="error"&&signed())return h+errState();
  const out=!signed();
  const signCard=`<div class="card"><div style="text-align:center;padding:26px 16px">${avatar(72)}<div class="b" style="font-size:18px;margin:12px 0 4px">${t("signInManageT")}</div><div class="mute sm" style="margin-bottom:14px">${t("signInManageD")}</div><div style="max-width:200px;margin:auto">${btn(t("signIn"),"startSignIn()")}</div></div></div>`;

  const L=listingsBlock();
  if(v==="A"){
    h+=out?signCard:`<div class="card row" onclick="push('profile')">${avatar(56,S.name)}<div class="l"><div class="b" style="font-size:17px">${S.name||idLabel()}</div>${S.name?`<div class="mute sm">${idLabel()}</div>`:""}</div><span class="chev">${ic.chev}</span></div>`;
    h+=`<div class="card row" onclick="push('listingsStub')"><div style="font-size:22px">☰</div><div class="l"><div class="b">${t("myListings")}</div></div><span class="chev">${ic.chev}</span></div><div class="pad" style="margin-top:6px">${btn("＋ "+t("listCar"),"reset('sell')")}</div>`;
  }else if(v==="B"){
    if(out)h+=signCard;
    else{
      h+=`<div class="card"><div class="row" onclick="push('profile')" style="min-height:64px">${avatar(48,S.name)}<div class="l"><div class="b" style="font-size:17px">${S.name||t("profile")}</div><div class="mute sm">${t("profile")} · ${t("methods")}</div></div><span class="chev">${ic.chev}</span></div>
      <div class="row" onclick="${hasPhone()?"push('profile')":"startMethod('add','phone')"}"><span>☎</span><div class="l">${hasPhone()?`<div class="b">${maskPhoneDisp(S.phone)}</div><div class="badge ver">✓ ${t("phoneVer")}</div>`:`<div class="mute">${t("phone")}: ${t("notAdded")}</div>`}</div>${hasPhone()?"":`<span class="b sm" style="color:var(--info)">${t("add")}</span>`}<span class="chev">${ic.chev}</span></div>

const DKEYS=Object.keys(DEC);
function setV(k,o){if(!DEC[k].opts[o])return;S.v[k]=o;S.dec=k;DEC[k].screen();}
function cycle(d){const k=S.dec,ks=Object.keys(DEC[k].opts),i=(ks.indexOf(S.v[k])+d+ks.length)%ks.length;setV(k,ks[i]);}
function nextDec(){const i=(DKEYS.indexOf(S.dec)+1)%DKEYS.length;S.dec=DKEYS[i];DEC[S.dec].screen();}
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1);});
function switcher(){
  const d=DEC[S.dec],o=d.opts[S.v[S.dec]];
  document.getElementById("switcher").innerHTML=`<button onclick="cycle(-1)">←</button><span class="lbl">D${DKEYS.indexOf(S.dec)+1} ${d.name}: ${S.v[S.dec]} — ${o[0]}${d.locked?" (approved)":d.rec===S.v[S.dec]?" ★ pending review":" pending review"}</span><button onclick="cycle(1)">→</button><button onclick="nextDec()">next decision ▸</button>`;
}

const codeFlow=(kind,type,extra={})=>{S.flow=Object.assign({kind,type,val:type==="phone"?"60 00-00-00":"name@example.com",err:null,code:"",cerr:null,sec:15,resends:0,step:"code",back:[{id:"cabinet"},{id:"profile"}]},extra);};

/* ───────────── panel ───────────── */
function seg(items,cur,fn){return `<div class="seg">${items.map(([k,n])=>`<button class="${cur===k?"on":""}" onclick="${fn}('${k}')">${n}</button>`).join("")}</div>`;}
window.pWeb=k=>{S.webProfile=k;render();};
window.pAcct=k=>{S.acct=k;S.data="ok";setAcctReset();};function setAcctReset(){render();}
window.pLang=k=>{S.lang=k;render();};window.pTheme=k=>{S.theme=k;render();};window.pOs=k=>{S.os=k==="dark";render();};
window.pOut=k=>{S.outcome=k;render();};window.pReq=k=>{S.req=k;render();};window.pDel=k=>{S.delOut=k;render();};window.pData=k=>{S.data=k;render();};
window.pDec=(k,o)=>setV(k,o);
const STATES=[
 ["Cabinet: signed out / phone only / email only / both","Cabinet jumps","apps/mobile/app/(tabs)/services.tsx","exists (A-like); B layout and status counts are proposed"],
 ["Cabinet loading / error","Cabinet jumps","services.tsx (spinner and text only)","exists; skeleton + Retry button new"],
 ["Sign-in entry: phone / email","Sign in → Entry","app/(auth)/phone.tsx, email.tsx, components/auth/AuthEntryScreen.tsx, SignInMethodTabs.tsx","approved Phone | Email tabs only"],
 ["Code entry (sent, countdown, resend)","Sign in → Code sent","components/auth/CodeEntryForm.tsx, app/(auth)/otp.tsx","exists. Phone “expires in 5 minutes” line is new (email 10 min exists)"],
 ["Invalid value","Sign in → Invalid value","phoneFormatError / emailFormatError in resources.ts","exists"],
 ["Rate limited on request / on resend","Sign in → Rate limited","rateLimitedCode in resources.ts","exists; daily 5-code limit copy is new"],
 ["Offline on request / verify","Sign in → Offline","offline in resources.ts","exists"],
 ["Wrong / expired / locked code","Sign in → Wrong, Expired, Locked","src/auth/verifyCodeError.ts","exists (all three)"],
 ["Email not delivered hint","Sign in → Email not delivered","none","new (ADR-0055: bounces fail silently)"],
 ["Restore prompt on sign-in in grace","Sign in → Restore prompt","restoreAccount* strings in resources.ts","strings exist; verify the dialog is wired in app code"],
 ["Profile: phone only / email only / both","Profile jumps","apps/mobile/app/profile.tsx","exists. Listing contact verification belongs inside #354"],
 ["Profile loading / error","Profile loading, error","profile.tsx (LoadingState, ErrorState)","exists"],
 ["Add phone / Add email entry","Profile → Add jumps","app/account/add-phone.tsx, add-email.tsx","exists"],
 ["Add/change: code sent, wrong, expired","Profile → Add: code sent, wrong, expired","app/account/verify-sign-in-method.tsx + CodeEntryForm","exists"],
 ["Value taken by another User","Profile → Add: value taken","SIGN_IN_METHOD_TAKEN → phoneTaken/emailTaken in verifyCodeError.ts","exists (variant A). Variant B button is new"],
 ["Change phone/email (+ warning sheet)","Profile → Change phone","add-phone.tsx (change mode)","exists; warning sheet is proposed (decision D5)"],
 ["Sell entry: email-only and phone Users","Selling jumps","ADR-0056; wizard prototype #354","approved rule; wizard design deferred"],
 ["Settings: language, theme, legal links","Settings jumps","apps/mobile/app/settings.tsx","exists (A). Links must move to autotm.bagtyyar.dev (#496; today hardcodes auto.tm)"],
 ["Language RU/TK/EN, theme light/dark/system","Settings, floating bar, panel","LocaleSwitcher, ThemeSwitcher in apps/mobile/src","exists"],
 ["Notifications settings screen","Settings → Notifications","none in mobile (PRD docs/prd/features/36-notifications.md “Profile → Notifications”)","new. informational OS-permission / per-conversation mute view; no category switches"],
 ["Notifications OS-permission off","Settings → Notifications: OS off","none","new"],
 ["Log out + confirm","Account → Log out dialog","settings.tsx","exists"],
 ["Delete account intro + confirm + scheduled","Account → Delete jumps","apps/mobile/app/account/delete.tsx","exists. “What happens” list and understand checkbox are new"],
 ["Delete failed","Account → Delete: failed","delete.tsx (deleteAccountFailed)","exists"],
 ["Web deletion page (phone or email code)","Account → Web deletion","none; #386 API, #389 page open","new"],
];
function panel(){
  const d=DEC[S.dec];const cur=S.v[S.dec];
  let h=`<h1>PROTOTYPE — Cabinet, Profile, Settings and sign-in methods</h1><div class="sm" style="color:#555">Throwaway (issue #353). Everything in the phone is clickable; the jump buttons set up any state in one click. ← → flip the variant of the current decision. Account values and demo codes are made up; the support contacts are founder-approved; type any six digits as a code. Resend countdown is 15 s here (60 s backoff in the product).</div>
  <h2>Account state</h2>${seg([["out","Signed out"],["phone","Phone only"],["email","Email only"],["both","Phone + email"]],S.acct,"pAcct")}
  <h2>Language / theme</h2>${seg([["en","EN"],["ru","RU"],["tk","TK"]],S.lang,"pLang")} ${seg([["light","Light"],["dark","Dark"],["system","System"]],S.theme,"pTheme")} <span class="sm">device is</span> ${seg([["light","light"],["dark","dark"]],S.os?"dark":"light","pOs")}
  <h2>Mock public-web configuration</h2>${seg([["production","Production"],["staging","Staging"]],S.webProfile,"pWeb")}<div class="sm">Prototype setting only; legal and deletion routes use this base. External-network reachability is #496 evidence.</div>
  <h2>Next result (one-shot, then back to OK)</h2>
  <div class="q">Code check ${seg([["ok","Accept"],["wrong","Wrong"],["expired","Expired"],["locked","Locked"],["offline","Offline"],["taken","Value taken (add/change)"],["grace","Grace period (sign-in)"]],S.outcome,"pOut")}</div>
  <div class="q">Get code / resend ${seg([["ok","Sent"],["rate","Rate limited"],["rateDay","Daily limit"],["offline","Offline"]],S.req,"pReq")}</div>
  <div class="q">Delete account ${seg([["ok","Succeeds"],["fail","Fails"]],S.delOut,"pDel")} &nbsp; Data load ${seg([["ok","OK"],["loading","Loading"],["error","Error"]],S.data,"pData")}</div>
  <h2>Jump to a state</h2>`;
  J.forEach((j,i)=>{h+=j.g?`<div class="grp">${j.g}</div>`:`<span class="jump" onclick="J[${i}].f()">${j.l}</span>`;});
  h+=`<h2>Decision D${DKEYS.indexOf(S.dec)+1}: ${d.name}</h2><div class="q sm">Reference: ${d.ref}</div>`;
  h+=Object.entries(d.opts).map(([k,o])=>`<div class="vdesc" style="${cur===k?"":"opacity:.55"}"><b>${k}. ${o[0]}</b>${d.locked?'<span class="rec">founder approved</span>':d.rec===k?'<span class="rec">recommended, pending review</span>':'<span class="rec">pending review</span>'}<br>${o[1]}</div>`).join("");
  h+=seg(Object.entries(d.opts).map(([k,o])=>[k,k+" "+o[0]]),cur,`(k=>pDec('${S.dec}',k))`);
  h+=`<div style="margin-top:8px">${DKEYS.map((k,i)=>`<span class="jump" style="${k===S.dec?"background:#171717;color:#fff":""}" onclick="S.dec='${k}';DEC['${k}'].screen()">D${i+1} ${DEC[k].name}</span>`).join("")}</div>`;
  h+=`<h2>Conflicts resolved</h2><div class="q sm"><p>D2 B/C removed. <a href="https://github.com/bagtyyarkovusov/auto.tm-rewrite/issues/353#issuecomment-5937369580">#353 founder feedback</a> approves A, Phone | Email tabs.</p><p>Cabinet C removed. <a href="https://github.com/bagtyyarkovusov/auto.tm-rewrite/issues/344#issuecomment-5759595278">#344 resolution</a> keeps Cabinet, Profile and separate Settings in the screen catalogue.</p><p>Both account-phone selling gates removed. <a href="../../../adr/0056-listing-contact-phones-are-verified.md">ADR-0056, Enforcement</a> says email-only Users verify a Listing contact phone inside the wizard; no account phone is required. It supersedes PHONE_REQUIRED and ADR-0054's Add a phone Sell step. The contact number can differ from the account phone and never becomes a Sign-in Method. #354 owns wizard design.</p><p>In-app deletion OTP removed. <a href="../../../adr/0054-phone-or-email-sign-in-share-one-user.md">ADR-0054, Deletion</a> keeps DELETE /me unchanged. Codes belong to web deletion. <a href="../../../adr/0032-account-deletion-grace-period.md">ADR-0032, Decision 1–3</a> supplies the 30-day grace, session revocation, archive, explicit recovery prompt and retained counterparty content.</p><p>Legal hosts use autotm.bagtyyar.dev, per <a href="https://github.com/bagtyyarkovusov/auto.tm-rewrite/issues/322#issuecomment-5936499997">#322 decision and #496</a>. No Share action is present.</p><p>Help is available signed out and signed in. <a href="https://github.com/bagtyyarkovusov/auto.tm-rewrite/issues/352#issuecomment-5937367553">#352 contact details</a> and <a href="https://github.com/bagtyyarkovusov/auto.tm-rewrite/issues/500#issuecomment-5937368548">#500 decision</a> provide email and phone using the contact-sheet design. No hours or response promise was supplied. Live support chat is after reviewer release.</p><p>ADR-0054 add/change stays code-confirmed; taken values are refused after confirmation, without account merging or a state mutation. ADR-0055 keeps email code delivery and its 10-minute expiry.</p><p>All surviving layout, Settings controls, Change warning, taken-value recovery buttons, deletion checkbox/copy and notification information view remain proposals pending founder review. Recommendations are not approvals. New RU/TK copy needs native-speaker review.</p></div>`;
  h+=`<h2>Pending founder review</h2><div class="q sm">• Web deletion confirmation copy is neutral (“If an account uses this phone…”) because ADR-0054 says a code request never reveals whether a value is registered. Wording is proposed; code requests must stay neutral.<br>• Phone codes expire in 5 min, email in 10 (ADR-0054); the phone line is new in the UI.<br>• Display name: not editable in the app today (Kolesa KZ-31 has Edit name). Left out; no ticket asks for it.<br>• Notification category toggles removed: PRD 30 defers preferences and PRD 36 defers the full platform. Message push uses OS permission and per-conversation mute. No reviewer-release Listing activity preference is asserted.<br>• Language switcher stays on the sign-in screen (as today).</div>`;
  h+=`<details ${S.o1?"open":""} ontoggle="S.o1=this.open"><summary>State inventory: where in the prototype, exists today or new</summary><table><tr><th>State</th><th>Where here</th><th>Today (file)</th><th>Status</th></tr>${STATES.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[3].startsWith("new")?"new":/new|pending|verify/.test(r[3])?"chg":"have"}">${r[3]}</td></tr>`).join("")}</table></details>`;
  h+=`<details ${S.o2?"open":""} ontoggle="S.o2=this.open"><summary>Reference notes (batches 3 and 4, viewed locally, not copied)</summary><div class="q sm">
  • AR-41-002/004: Auto.ru “Menu” is a sheet of service tiles (wallet, reports, garage, insurance, credit) above a plain list: notifications, theme, help, licence agreement, privacy, about. Tiles are out of scope (rejected: credit, history reports, garage). The menu reference must keep the separately approved Settings screen; Cabinet C was removed.<br>
  • AR-43-002: sign-in is a sheet that chooses an account provider; AutoTM has no social sign-in, so the method-first alternative was removed because D2=A is approved.<br>
  • AR-44-001: profile header is a banner with name and a settings gear; social counters and Garage are out of scope.<br>
  • AR-40-002: notification settings group by topic with a channel summary under each row; we use switches because there is one channel (push).<br>
  • KZ-27-003 / KZ-35-001: cabinet shows name, the login phone as a row with a chevron, then My listings by status with counts, then the primary post button; settings are grouped Personal data, App settings, Push (variants B and A). Balance, PLUS and car history are out of scope.<br>
  • KZ-32-003: changing the phone shows a sheet saying the new number must be used to sign in (decision D5).<br>
  • KZ-48-002: delete screen lists what will be lost and requires an “I understand” checkbox before the red button (decision D7). Kolesa deletes immediately; AutoTM has a 30-day grace (ADR-0032), so the copy says so.<br>
  • Not opened: AR-42-002..4, AR-43-001/3/5, AR-44-002/3, AR-40-003..8, KZ-28/29 detail, KZ-31, KZ-37, KZ-38, KZ-41..44, KZ-52 (register/login/password flows, edit name, contacts, language, legal pages, onboarding video). KZ-28/29/30/36 are password flows and are rejected for AutoTM.</div></details>`;
  document.getElementById("panel").innerHTML=h;
}
render();
</script>
