<!--
  PROTOTYPE — throwaway. Issue #353 "Prototype Cabinet, Profile, Settings, and sign-in method screens", third version.
  The founder rejected the version at a051faf (2026-10-02, second round): Profile and Settings should follow Auto.ru and be
  minimal, Contact support was overused, and the selling functions the Cabinet references must be thought through first.
  This version: one plain menu list in Auto.ru's manner (AR-41-004), Help exactly once in that list, and a seller-function
  inventory read from origin/main that drives the My listings entry. The My listings screen here is a stub; #354 owns it.
  Locked and unchanged: Phone | Email sign-in tabs by code, one User, no password/social/merge; add/change after a code;
  no account-phone gate to sell (ADR-0056); in-app deletion by session, web deletion by code, 30-day grace with explicit
  restore (ADR-0032, ADR-0054); host autotm.bagtyyar.dev, route /:locale/account/delete; no Share; no notification
  category switches; five tabs. Everything else here is a proposal for the founder. Recommendations are not approvals.
  Account values and codes are made up. Support contacts are the founder-approved public contacts (#352 D10).
  Colours are AutoTM tokens from apps/mobile/global.css. Auto.ru is a structure reference, not a visual template (ADR-0051).
  New RU/TK wording needs founder review.
-->

const t=(k,v)=>{const a=TX[k];if(!a)throw new Error("Missing translation: "+k);let s=a[LANGS.indexOf(S.lang)];if(s==null)throw new Error("Missing translation: "+k+" ("+S.lang+")");if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s;};
const LANGNAME={en:"English",ru:"Русский",tk:"Türkmençe"};

/* ───────────── state ───────────── */
const S={
  webProfile:"production", acct:"out", phone:"+993 61 00-00-00", email:"name@example.com",   // all fake
  lang:"en", theme:"light", os:false,
  stack:[{id:"cabinet"}], tab:"cabinet",
  v:{set:"A",list:"A",groups:"A",sellbtn:"A",pick:"A",acct:"A",chg:"B",taken:"A"},
  dec:"set", data:"ok", outcome:"ok", req:"ok", delOut:"ok",
  flow:null, ret:null, toast:null, sheet:null, dlg:null, web:null, delChecked:false,
  notif:{os:"granted"}, picker:null, name:null, inv:"some", blocked:false, ltab:null,
};
const hasPhone=()=>S.acct==="phone"||S.acct==="both", hasEmail=()=>S.acct==="email"||S.acct==="both", signed=()=>S.acct!=="out";

const mockAccount=()=>({acct:S.acct,phone:hasPhone()?S.phone:null,email:hasEmail()?S.email:null});
const matchesAccount=(a,f)=>a&&(a.acct===f.type||a.acct==="both")&&(f.type==="phone"?a.phone?.replace(/\D/g,"")===('993'+f.val.replace(/\D/g,"")):a.email===f.val);
const maskPhoneDisp=p=>{const raw=p.replace(/\D/g,"");const d=raw.startsWith("993")?raw.slice(3):raw;return "+993 "+d[0]+"• ••-••-"+d.slice(-2);};
const maskEmail=e=>{const [a,b]=e.split("@");return a[0]+"•••@"+b;};
const dest=(type,val)=>type==="phone"?maskPhoneDisp(val):maskEmail(val);
const topScreen=()=>S.stack[S.stack.length-1];
const TABS=["search","favorites","sell","messages","cabinet"];
const isTab=id=>TABS.includes(id);
const fmtPhone=d=>(d=d.replace(/\D/g,"").slice(0,8),d.length>6?d.slice(0,2)+" "+d.slice(2,4)+"-"+d.slice(4,6)+"-"+d.slice(6):d.length>4?d.slice(0,2)+" "+d.slice(2,4)+"-"+d.slice(4):d.length>2?d.slice(0,2)+" "+d.slice(2):d);
const validPhone=v=>{const d=v.replace(/\D/g,"");return d.length===8&&d[0]==="6";};
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

/* ───────────── navigation ───────────── */
function push(id,p={}){S.stack.push({id,...p});render();}
function pop(){if(S.stack.length>1)S.stack.pop();render();}
function reset(tab){S.tab=tab;S.stack=[{id:tab}];S.sheet=S.dlg=null;render();}
function toast(m){S.toast=m;render();clearTimeout(window._t);window._t=setTimeout(()=>{S.toast=null;render();},2400);}
function startSignIn(){S.ret=S.stack.slice();S.flow={kind:"signin",type:"phone",val:"",err:null,step:"entry"};push("signin");}
function closeSignIn(){S.stack=S.ret||[{id:"cabinet"}];S.flow=null;render();}
function startMethod(kind,type){S.flow={kind,type,val:"",err:null,step:"entry",back:S.stack.slice()};push("methodEntry");}
function switchTab(tab){if(S.tab===tab){reset(tab);return;}S.histories=S.histories||{};S.histories[S.tab]=S.stack.slice();S.tab=tab;S.stack=S.histories[tab]||[{id:tab}];S.sheet=S.dlg=S.web=S.picker=null;render();}
const webBase=()=>S.webProfile==="staging"?"https://staging.autotm.bagtyyar.dev":"https://autotm.bagtyyar.dev";
function openLegal(kind){S.web={kind};render();}
function openPick(k){if(S.v.pick==="A"){S.picker=k;render();}else push("pick",{k});}
function openListings(k){const gs=groups();if(k==="drafts"&&!gs.some(g=>g.k==="drafts")){switchTab("sell");return;}S.ltab=k&&gs.some(g=>g.k===k)?k:gs[0].k;push("listings");}
window.setLang=l=>{S.lang=l;S.picker=null;render();};window.setTheme=m=>{S.theme=m;S.picker=null;render();};

/* ───────────── flows (mock account logic unchanged from a051faf) ───────────── */
function liveVal(el){
  const f=S.flow;let v=el.value;
  if(f.type==="phone"){v=fmtPhone(v.replace(/^\+?993/,""));el.value=v;}
  f.val=v;f.err=null;
}
function demoFill(){const f=S.flow;f.val=f.type==="phone"?"60 00-00-00":"name@example.com";f.err=null;render();}
function getCode(){
  const f=S.flow;let type=f.type;
  let val=f.val.trim();
  const phoneish=type==="phone";
  const ok=phoneish?validPhone(val):validEmail(val);
  if(!ok){f.err="invalid";f.type=type;render();return;}
  const r=S.req;S.req="ok";
  if(r==="offline"){f.err="offline";render();return;}
  if(r==="rate"){f.err="rate";render();return;}
  if(r==="rateDay"){f.err="rateDay";render();return;}
  f.type=type;f.val=phoneish?val:val.toLowerCase();f.err=null;f.code="";f.cerr=null;f.sec=15;f.resends=0;f.nomail=false;
  if(f.kind==="webdelete"){f.step="code";render();}else push("code");
}
function key(d){
  const f=S.flow;if(!f||["locked","expired","rateDay"].includes(f.cerr)||f.busy)return;
  f.code=f.code||"";
  if(d==="<"){f.code=f.code.slice(0,-1);f.cerr=null;render();return;}
  if(f.code.length>=6)return;
  f.code+=d;f.cerr=null;render();
  if(f.code.length===6){f.busy=true;setTimeout(submitCode,350);}
}
function submitCode(){
  const f=S.flow;if(!f)return;f.busy=false;
  let o=S.outcome;S.outcome="ok";
  if(o==="taken"&&!(f.kind==="add"||f.kind==="change"))o="ok";
  if(o==="grace"&&f.kind!=="signin")o="ok";
  if(o==="wrong"||o==="expired"||o==="locked"||o==="offline"){f.cerr=o;f.code="";render();return;}
  if(o==="taken"){S.stack.pop();push("taken");return;}
  success(o==="grace");
}
function success(grace){
  const f=S.flow;
  if(f.kind==="signin"){
    const previous=S.savedAccount;
    if(grace&&matchesAccount(previous,f)&&!S.deletionPending){S.deletedAccount={...previous};S.deletionPending=true;}
    const recovering=S.deletionPending&&matchesAccount(S.deletedAccount,f);
    const account=recovering?S.deletedAccount:matchesAccount(previous,f)?previous:{acct:f.type,phone:f.type==="phone"?"+993 "+f.val:null,email:f.type==="email"?f.val:null};
    S.stack=S.ret;S.flow=null;S.restoreAccount=null;S.dlg=null;S.histories={};
    if(recovering){S.restoreAccount={...account};S.acct="out";S.dlg="restore";render();}
    else{Object.assign(S,account);S.savedAccount=mockAccount();toast(t("signedIn"));}
  }else if(f.kind==="add"||f.kind==="change"){
    if(f.type==="phone")S.phone="+993 "+f.val;else S.email=f.val;
    S.acct=f.type==="phone"?(hasEmail()?"both":"phone"):(hasPhone()?"both":"email");S.savedAccount=mockAccount();S.stack=f.back;S.flow=null;toast((f.kind==="add"?t("added"):t("changed"))+": "+dest(f.type,f.type==="phone"?S.phone:S.email));
  }else if(f.kind==="webdelete"){f.step="done";render();}
}
function resend(){
  const f=S.flow;if(f.sec>0)return;
  const r=S.req;S.req="ok";
  if(r==="rateDay"||f.resends>=4){f.cerr="rateDay";render();return;}
  if(r==="rate"){f.cerr="rate";render();return;}
  if(r==="offline"){f.cerr="offline";render();return;}
  f.resends++;f.sec=15;f.code="";f.cerr=null;toast(t("otpSent",{d:dest(f.type,f.val)}));
}
function backFromCode(){const f=S.flow;f.code="";f.cerr=null;if(f.kind==="webdelete"){f.step="entry";render();}else if(f.kind==="delete"){S.flow=null;pop();}else pop();}
setInterval(()=>{const f=S.flow;if(f&&f.sec>0&&(topScreen().id==="code"||(topScreen().id==="webDelete"&&f.step==="code"))){f.sec--;renderPhone();}},1000);

function doDelete(){
  S.dlg=null;const o=S.delOut;S.delOut="ok";
  if(o==="fail"){S.delFailed=true;render();return;}
  S.delFailed=false;S.delChecked=false;
  S.histories={};S.savedAccount=mockAccount();S.deletedAccount={...S.savedAccount};S.restoreAccount=null;S.deletionPending=true;S.acct="out";S.stack=[{id:"cabinet"}];S.tab="cabinet";S.flow=null;push("scheduled");
}
function doLogout(){S.histories={};S.savedAccount=mockAccount();S.dlg=null;S.acct="out";reset("cabinet");toast(t("signedOut"));}
function restore(){if(!S.restoreAccount)return;Object.assign(S,S.restoreAccount);S.savedAccount=mockAccount();S.deletedAccount=S.restoreAccount=null;S.deletionPending=false;S.dlg=null;toast(t("restored"));}
function restoreCancel(){S.restoreAccount=null;S.dlg=null;S.acct="out";render();}

function seg(items,cur,fn){return `<div class="seg">${items.map(([k,n])=>`<button class="${cur===k?"on":""}" onclick="${fn}('${k}')">${n}</button>`).join("")}</div>`;}
window.pWeb=k=>{S.webProfile=k;render();};
window.pAcct=k=>openAs(k);
window.pName=k=>{S.name=k==="yes"?"Aman":null;render();};
window.pInv=k=>{S.inv=k;render();};window.pBlocked=k=>{S.blocked=k==="yes";render();};
window.pLang=k=>{S.lang=k;render();};window.pTheme=k=>{S.theme=k;render();};window.pOs=k=>{S.os=k==="dark";render();};
window.pOut=k=>{S.outcome=k;render();};window.pReq=k=>{S.req=k;render();};window.pDel=k=>{S.delOut=k;render();};window.pData=k=>{S.data=k;render();};

function panel(){
  let h=`<h1>PROTOTYPE — Cabinet, Profile and Settings, Auto.ru-style</h1><div class="s13" style="color:#555">Throwaway (issue #353, third version). Everything in the phone is clickable; jump buttons set up any state in one click; ← → flip the option of the highlighted decision. Account values are made up; type any six digits as a code. Resend countdown is 15 s here (60 s in the product). Nothing below is approved except the “Locked” list. New RU and TK wording needs founder review.</div>
  <h2>Account state</h2>${seg([["out","Signed out"],["phone","Phone only"],["email","Email only"],["both","Phone + email"]],S.acct,"pAcct")} &nbsp; Display name ${seg([["no","none"],["yes","“Aman”"]],S.name?"yes":"no","pName")}
  <div class="s13" style="color:#555;margin-top:4px"><code>User.displayName</code> exists in the schema but nothing sets it (there is no <code>PATCH /me</code>), so most Users have none. The prototype adds no name editor.</div>
  <h2>Seller inventory (mock)</h2>${seg([["some","2 active, 1 draft, 1 sold, 1 archived"],["none","No listings"]],S.inv,"pInv")} &nbsp; Blocked Listing ${seg([["no","no"],["yes","yes"]],S.blocked?"yes":"no","pBlocked")}
  <h2>Language / theme</h2>${seg([["en","EN"],["ru","RU"],["tk","TK"]],S.lang,"pLang")} ${seg([["light","Light"],["dark","Dark"],["system","System"]],S.theme,"pTheme")} <span class="s13">device is</span> ${seg([["light","light"],["dark","dark"]],S.os?"dark":"light","pOs")}
  <h2>Next result (one-shot, then back to OK)</h2>
  <div class="q">Code check ${seg([["ok","Accept"],["wrong","Wrong"],["expired","Expired"],["locked","Locked"],["offline","Offline"],["taken","Value taken (add/change)"],["grace","Grace period (sign-in)"]],S.outcome,"pOut")}</div>
  <div class="q">Get code / resend ${seg([["ok","Sent"],["rate","Rate limited"],["rateDay","Daily limit"],["offline","Offline"]],S.req,"pReq")}</div>
  <div class="q">Delete account ${seg([["ok","Succeeds"],["fail","Fails"]],S.delOut,"pDel")} &nbsp; Data load ${seg([["ok","OK"],["loading","Loading"],["error","Error"]],S.data,"pData")} &nbsp; Web ${seg([["production","Production"],["staging","Staging"]],S.webProfile,"pWeb")}</div>
  <h2>Jump to a state</h2>`;
  J.forEach((j,i)=>{h+=j.g?`<div class="grp">${j.g}</div>`:`<span class="jump" onclick="J[${i}].f()">${j.l}</span>`;});
  h+=`<h2>Decisions for the founder (all proposals)</h2>`;
  DKEYS.forEach((k,i)=>{const d=DEC[k],cur=S.v[k];
    h+=`<div class="dec ${S.dec===k?"cur":""}"><div class="ttl">D${i+1}. ${d.name}</div>${Object.entries(d.opts).map(([o,x])=>`<div class="opt ${cur===o?"on":""}"><b>${o}. ${x[0]}</b>${d.rec===o?'<span class="tag rec">recommended</span>':""}${d.conflict===o?'<span class="tag conf">conflicts with an approved decision</span>':""}<br>${x[1]}</div>`).join("")}<div class="why" style="margin:6px 0"><b>Why ${d.rec}:</b> ${d.why}</div>${seg(Object.entries(d.opts).map(([o,x])=>[o,o+" "+x[0]]),cur,`(o=>pDec('${k}',o))`)}<div class="xs" style="color:#777;margin-top:5px">Reference: ${d.ref}</div></div>`;});
  h+=`<h2>Conflicts with approved decisions (founder must resolve)</h2><div class="q">
  <p><b>D1 option A against #344.</b> The <a href="https://github.com/bagtyyarkovusov/auto.tm-rewrite/issues/344#issuecomment-5759595278">#344 resolution</a> lists Cabinet, Profile and Settings as three screens. Auto.ru has no Settings screen, so following it removes one. Option B keeps #344 unchanged.</p>

  <p><b>#352 D10 is outside this file.</b> It still plans a Support row pinned in Messages and “Need help?” links in Favorites and Messages empty and error states. If Contact support should appear once, that decision needs revisiting in #352.</p>
  <p><b>#344 wording superseded.</b> #344 says “Selling needs a verified phone”. ADR-0056 replaced that with per-Listing contact-phone verification inside the wizard; this prototype has no account-phone gate.</p></div>`;
  h+=`<h2>Locked (not reopened here)</h2><div class="q">Phone | Email sign-in tabs, both by code, one User; no password, no social sign-in, no merging or removing methods; add/change only after a code; email trimmed and lowercased. No account-phone gate to sell (ADR-0056). In-app deletion uses the session; web deletion confirms a code; 30-day grace with explicit restore; <code>autotm.bagtyyar.dev/:locale/account/delete</code>. No Share. No notification category switches. Five tabs. Contact details: <code>mailto:bagtyyarkowusow.dev@gmail.com</code>, <code>tel:+99363989404</code>, no hours, no response time, no chat.</div>`;
  h+=`<h2>Seller functions: what exists and what the release keeps</h2><div class="s13" style="color:#555;margin-bottom:6px">Read from <code>origin/main</code> at 8ed5dcb. “Proposed” is a proposal for the founder, not a decision. Source is current behaviour; the PRD is intent.</div><table><tr><th>Status or function</th><th>API today</th><th>Mobile today</th><th>Who triggers</th><th>Proposed</th><th>Where Cabinet references it</th></tr>${SELLER.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="${r[4]}">${r[4]}</td><td>${r[5]}</td></tr>`).join("")}</table>`;
  h+=`<h2>Every place Help or Contact support appears (${HELP.length})</h2><table><tr><th>What</th><th>Where</th><th>Notes</th></tr>${HELP.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table><div class="s13" style="color:#555;margin-top:4px">Removed since a051faf: the Contact support card on signed-out and signed-in Cabinet, the card on Settings, and the “AutoTM Support ✓ Official” header.</div>`;
  h+=`<details ${S.o1?"open":""} ontoggle="S.o1=this.open"><summary>State inventory: where in the prototype, exists today or new</summary><table><tr><th>State</th><th>Where here</th><th>Today (file)</th><th>Status</th></tr>${STATES.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></details>`;
  h+=`<details ${S.o2?"open":""} ontoggle="S.o2=this.open"><summary>Reference captures viewed for this version (viewed locally, not copied)</summary><div class="q s13">
  <p><b>AR-41-001..004 (menu).</b> Hamburger on Home opens a “Меню” sheet: first tile “Войти / Авторизация”, service tiles, then seven plain rows with a small grey icon and a hairline divider, no chevrons and no values: notification settings, theme settings, help, licence agreement, privacy policy, recommendation rules, about. Taken: the plain list, the single Help row, sign-in as the first entry. Service tiles are out of scope.</p>
  <p><b>AR-42-002 (theme).</b> A bottom sheet over the menu with Light, Dark, System and a red radio mark. Taken for D5.</p>
  <p><b>AR-40-002 (notification settings).</b> A plain screen of rows grouped by topic. Categories are deferred in AutoTM, so only the device state and the system-settings row are shown.</p>
  <p><b>AR-45-001, AR-46-002 (help).</b> Help is one menu row that opens a support chat. AutoTM has no chat for the release, so the row opens the email and phone screen.</p>
  <p><b>AR-43-002, AR-43-004, AR-43-005 (auth, signed-in profile).</b> Sign-in is a Yandex ID account sheet (not applicable). The signed-in profile is a banner with avatar, name, a gear and a ⋯ button over social counters and Garage tiles. Taken: avatar and name only. The captures do not show what the gear or ⋯ open, nor where Log out is.</p>
  <p><b>AR-44-001..003 (first login).</b> Splash, the system notification permission prompt, then Home. Nothing taken.</p>
  <p><b>AR-50-002, -003, -004, -053..056 (selling).</b> The Sell tab is titled “Объявления” and holds the seller's own listings: a profile icon top right, “+ Добавить”, and per Listing the views, calls, saves, “60 дней до снятия”, Edit and Remove from sale, then paid promotion blocks. No drafts list, status tabs or archive are visible in the captures viewed. AR-50-005..052 (the wizard steps) were not opened.</p>
  <p><b>KZ-27-003, KZ-51-002, KZ-51-005 (Kolesa, for contrast).</b> Cabinet shows “Мои объявления” with “На сайте” and, once non-empty, “В архиве”, each with a count. Remove from sale asks a reason and moves the Listing to the archive, so sold folds into archive. Taken for D3 option C and the fold in option A.</p>
  <p><b>Not in the archive:</b> an Auto.ru screen for drafts, an archive or status tabs for own listings, the settings behind the profile gear, Log out, or account deletion.</p></div></details>`;
  document.getElementById("panel").innerHTML=h;
}
