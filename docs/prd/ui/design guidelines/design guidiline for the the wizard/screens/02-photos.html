<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Step 2 — Photos</title>
  <style>
    @font-face { font-family: 'UberMove'; src: url('../fonts/UberMoveBold.otf') format('opentype'); font-weight: 700; }
    @font-face { font-family: 'UberMove'; src: url('../fonts/UberMoveMedium.otf') format('opentype'); font-weight: 500; }
    @font-face { font-family: 'UberMoveText'; src: url('../fonts/UberMoveTextRegular.otf') format('opentype'); font-weight: 400; }
    @font-face { font-family: 'UberMoveText'; src: url('../fonts/UberMoveTextMedium.otf') format('opentype'); font-weight: 500; }
    @font-face { font-family: 'UberMoveText'; src: url('../fonts/UberMoveTextBold.otf') format('opentype'); font-weight: 700; }
    @font-face { font-family: 'UberMoveMono'; src: url('../fonts/UberMoveMono-Regular.woff2') format('woff2'); font-weight: 400; }
    @font-face { font-family: 'UberMoveMono'; src: url('../fonts/UberMoveMono-Medium.woff2') format('woff2'); font-weight: 500; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 20px;
      border-bottom: 1px solid #e2e2e2;
      background: #ffffff;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #000000;
      transition: background 0.15s ease;
    }
    .icon-btn:hover { background: #f3f3f3; }
    .icon-btn:active { opacity: 0.6; }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }
    .header-title {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }
    .header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .step-label { font-size: 13px; font-weight: 500; color: #4b4b4b; }
    .save-status { font-size: 13px; font-weight: 500; color: #4b4b4b; }
    .save-status.saved { color: #16a34a; }
    .progress-track { height: 4px; border-radius: 2px; background: #e2e2e2; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; background: #000000; transition: width 0.3s ease; }

    .body {
      flex: 1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .step-title {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .action-row { display: flex; gap: 12px; }
    .action-btn {
      flex: 1;
      height: 48px;
      border-radius: 999px;
      border: 1.5px solid #e2e2e2;
      background: #ffffff;
      color: #000000;
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .action-btn:hover { background: #f3f3f3; }
    .action-btn:active { transform: scale(0.98); }
    .action-btn svg { width: 20px; height: 20px; stroke-width: 2; }

    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: #efefef;
      font-size: 13px;
      font-weight: 500;
      color: #000000;
      border: none;
      cursor: default;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .photo-tile {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      background: #f3f3f3;
      position: relative;
      overflow: hidden;
      border: 1px solid #e2e2e2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-tile img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .photo-tile.failed {
      border-color: #e2e2e2;
    }
    .photo-tile.failed .img-wrap {
      opacity: 0.45;
    }
    .cover-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #000000;
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
    }
    .progress-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(0,0,0,0.12);
    }
    .progress-overlay-fill {
      height: 100%;
      background: #000000;
      transition: width 0.3s ease;
    }
    .failed-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }
    .failed-icon {
      width: 28px;
      height: 28px;
      background: #000000;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .failed-icon svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .failed-label {
      font-size: 12px;
      font-weight: 500;
      color: #000000;
      text-align: center;
      line-height: 1.3;
    }
    .retry-btn {
      height: 32px;
      padding: 0 16px;
      border-radius: 999px;
      border: none;
      background: #000000;
      color: #ffffff;
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .retry-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .retry-btn:active { transform: scale(0.96); opacity: 0.85; }
    .retry-btn:hover { opacity: 0.9; }

    .photo-helper {
      font-size: 13px;
      color: #4b4b4b;
      line-height: 1.5;
    }

    .footer {
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid #e2e2e2;
      background: #ffffff;
      display: flex;
      gap: 12px;
    }
    .btn-primary {
      flex: 1;
      height: 52px;
      border-radius: 999px;
      border: none;
      background: #000000;
      color: #ffffff;
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .btn-primary:disabled {
      background: #e2e2e2;
      color: #afafaf;
      cursor: not-allowed;
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); opacity: 0.9; }
    .btn-outline {
      flex: 1;
      height: 52px;
      border-radius: 999px;
      border: 1.5px solid #000000;
      background: #ffffff;
      color: #000000;
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-outline:hover { background: #f3f3f3; }
    .btn-outline:active { transform: scale(0.98); }

    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 50;
    }
    .sheet-overlay.show { display: flex; }
    .action-sheet {
      background: #ffffff; border-radius: 16px 16px 0 0;
      padding: 8px 20px calc(24px + env(safe-area-inset-bottom));
      width: 100%;
      animation: sheet-up 0.25s ease;
    }
    @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-item {
      padding: 16px 0; font-size: 16px; font-weight: 500;
      color: #F43F5E; text-align: center; cursor: pointer;
      border-bottom: 1px solid #e2e2e2;
      background: none; border-left: none; border-right: none; border-top: none;
      width: 100%; font-family: inherit;
    }
    .sheet-item:last-child { border-bottom: none; color: #000000; }
    .sheet-item:active { opacity: 0.6; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <button class="icon-btn" onclick="goBack()" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>
      <span class="header-title">Sell car</span>
      <button class="icon-btn" onclick="showDiscard()" aria-label="More">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </div>
    <div class="header-meta">
      <span class="step-label" id="stepLabel">Step 2 of 8</span>
      <span class="save-status" id="saveStatus">Saved</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width: 25%;"></div>
    </div>
  </div>

  <div class="body">
    <div class="step-title">Add photos</div>

    <div class="action-row">
      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        Camera
      </button>
      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        Library
      </button>
    </div>

    <div class="chip-row">
      <span class="chip">Front</span>
      <span class="chip">Interior</span>
      <span class="chip">Odometer</span>
    </div>

    <div class="photo-grid" id="photoGrid">
      <div class="photo-tile">
        <div style="width:100%;height:100%;background:#d4d4d4;"></div>
        <span class="cover-badge">Cover</span>
      </div>
      <div class="photo-tile">
        <div style="width:100%;height:100%;background:#c4c4c4;"></div>
        <div class="progress-overlay"><div class="progress-overlay-fill" style="width:65%;"></div></div>
      </div>
      <div class="photo-tile failed">
        <div class="img-wrap" style="width:100%;height:100%;background:#b4b4b4;"></div>
        <div class="failed-overlay">
          <div class="failed-icon">
            <svg viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10z"/></svg>
          </div>
          <span class="failed-label">Couldn’t upload</span>
          <button class="retry-btn">
            <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
            Retry
          </button>
        </div>
      </div>
      <div class="photo-tile"><div style="width:100%;height:100%;background:#a4a4a4;"></div></div>
      <div class="photo-tile"><div style="width:100%;height:100%;background:#949494;"></div></div>
    </div>

    <p class="photo-helper">First photo is cover. Drag to reorder.<br>Photos under 5 MB upload faster.</p>
  </div>

  <div class="footer">
    <button class="btn-outline" onclick="goBack()">Back</button>
    <button class="btn-primary" id="continueBtn" onclick="goNext()">Continue</button>
  </div>

  <div class="sheet-overlay" id="menuSheet" onclick="closeMenu(event)">
    <div class="action-sheet" onclick="event.stopPropagation()">
      <button class="sheet-item" onclick="confirmDiscard()">Discard draft</button>
      <button class="sheet-item" onclick="closeMenu()">Cancel</button>
    </div>
  </div>

  <script>
    (function() {
      const qs = new URLSearchParams(location.search);
      const state = qs.get('state');
      const saveStatus = qs.get('saveStatus') || 'saved';
      const mode = qs.get('mode') || 'create';
      const grid = document.getElementById('photoGrid');
      const btn = document.getElementById('continueBtn');

      const saveEl = document.getElementById('saveStatus');
      if (saveStatus === 'saving') {
        saveEl.textContent = 'Saving…';
        saveEl.className = 'save-status';
      } else if (saveStatus === 'error') {
        saveEl.textContent = 'Could not save — Retry';
        saveEl.className = 'save-status error';
      } else {
        saveEl.textContent = 'Saved';
        saveEl.className = 'save-status saved';
      }

      if (mode === 'edit') {
        document.getElementById('stepLabel').textContent = 'Edit mode';
        document.querySelector('.header-title').textContent = 'Edit listing';
      }

      if (state === 'empty') {
        grid.innerHTML = '';
        btn.disabled = true;
      } else if (state === 'uploading') {
        // default state shows 65% upload
      } else if (state === 'failed') {
        // default state shows failed tile
      }
    })();

    function goBack() {
      window.parent.postMessage({ action: 'navigate', to: 'step1-vin' }, '*');
    }
    function goNext() {
      window.parent.postMessage({ action: 'navigate', to: 'step3-vehicle' }, '*');
    }
    function showDiscard() {
      document.getElementById('menuSheet').classList.add('show');
    }
    function closeMenu(e) {
      document.getElementById('menuSheet').classList.remove('show');
    }
    function confirmDiscard() {
      closeMenu();
      window.parent.postMessage({ action: 'navigate', to: 'discard' }, '*');
    }
  </script>
</body>
</html>
