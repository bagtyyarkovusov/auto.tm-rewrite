<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Phone Entry</title>
  <style>
    @font-face {
      font-family: 'UberMove';
      src: url('../fonts/UberMoveBold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'UberMove';
      src: url('../fonts/UberMoveMedium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'UberMoveText';
      src: url('../fonts/UberMoveTextRegular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'UberMoveText';
      src: url('../fonts/UberMoveTextMedium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'UberMoveText';
      src: url('../fonts/UberMoveTextBold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'UberMoveText';
      src: url('../fonts/UberMoveTextLight.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'UberMoveMono';
      src: url('../fonts/UberMoveMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'UberMoveMono';
      src: url('../fonts/UberMoveMono-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding: 0 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
    }
    .icon-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #000000;
      transition: background 0.15s ease;
    }
    .icon-btn:active { opacity: 0.6; }
    .icon-btn:hover { background: #f3f3f3; }
    .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }

    .lang-switcher {
      display: flex;
      gap: 4px;
    }
    .lang-chip {
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #A8A6A0;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-chip:hover { color: #525251; }
    .lang-chip.active {
      background: #efefef;
      color: #000000;
    }

    .brand-logo {
      margin-top: 24px;
      width: 130px;
      height: auto;
      display: block;
    }

    .title-group { margin-top: 32px; display: flex; flex-direction: column; gap: 8px; }
    .title {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.02em;
      color: #000000;
    }
    .subtitle {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: #4b4b4b;
    }

    .form { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
    .label {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      color: #000000;
    }
    .phone-wrap {
      display: flex;
      align-items: center;
      height: 52px;
      border: 1.5px solid #e2e2e2;
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .phone-wrap:focus-within {
      border-color: #000000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }
    .phone-wrap.has-error {
      border-color: #F43F5E;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.08);
    }
    .prefix {
      display: grid; place-items: center;
      height: 100%;
      padding: 0 14px;
      font-family: 'UberMoveMono', ui-monospace, Menlo, monospace;
      font-size: 17px;
      font-weight: 500;
      color: #000000;
      border-right: 1px solid #e2e2e2;
      background: #ffffff;
      white-space: nowrap;
    }
    .phone-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      padding: 0 14px;
      font-family: 'UberMoveMono', ui-monospace, Menlo, monospace;
      font-size: 17px;
      font-weight: 400;
      color: #000000;
      background: transparent;
    }
    .phone-input::placeholder {
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      color: #afafaf;
    }

    .helper {
      font-size: 13px;
      line-height: 1.5;
      color: #4b4b4b;
      min-height: 20px;
    }
    .helper.error { color: #F43F5E; }

    .btn-primary {
      margin-top: 8px;
      height: 52px;
      border-radius: 999px;
      border: none;
      background: #000000;
      color: #ffffff;
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .btn-primary:disabled {
      background: #e2e2e2;
      color: #afafaf;
      cursor: not-allowed;
    }
    .btn-primary .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary:active:not(:disabled) {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .network-banner {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #FFF1F2;
      border: 1px solid #FECDD3;
      font-size: 13px;
      font-weight: 500;
      color: #F43F5E;
      line-height: 1.4;
    }
    .network-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

    .legal {
      margin-top: auto;
      padding: 24px 0 32px;
      font-size: 12px;
      line-height: 1.5;
      color: #737170;
      text-align: center;
    }
    .legal a {
      color: #000000;
      text-decoration: underline;
      font-weight: 500;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="icon-btn" onclick="closeAuth()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="lang-switcher">
      <!-- i18n: RU, TK, EN -->
      <button class="lang-chip" onclick="setLang(this)">RU</button>
      <button class="lang-chip" onclick="setLang(this)">TK</button>
      <button class="lang-chip active" onclick="setLang(this)">EN</button>
    </div>
  </div>

  <img class="brand-logo" src="../assets/logo.svg" alt="auto.tm" />

  <div class="title-group">
    <!-- i18n: "Введите номер телефона" / "Telefon belgiňizi giriziň" / "Enter your phone number" -->
    <h1 class="title">Enter your phone number</h1>
    <!-- i18n: "Мы отправим код по SMS" / "SMS arkaly kod ibereris" / "We'll send a code by SMS" -->
    <p class="subtitle">We'll send a code by SMS.</p>
  </div>

  <div class="form">
    <!-- i18n: "Номер телефона" / "Telefon belgisi" / "Phone number" -->
    <label class="label" for="phone">Phone number</label>
    <div class="phone-wrap" id="phoneWrap">
      <span class="prefix">+993</span>
      <input
        id="phone"
        class="phone-input"
        type="tel"
        inputmode="tel"
        placeholder="6X XX-XX-XX"
        autocomplete="tel"
      />
    </div>
    <p class="helper" id="helper">Enter a Turkmenistan mobile number.</p>
  </div>

  <div class="network-banner" id="networkBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <span id="networkText">No connection. Check your network and try again.</span>
  </div>

  <!-- i18n: "Получить код" / "Kod alyň" / "Get code" -->
  <button class="btn-primary" id="cta" disabled>Get code</button>

  <p class="legal">
    <!-- i18n: "Продолжая, вы соглашаетесь с" / "Dowam etmegiňiz bilen, siz kabul edýärsiňiz" / "By continuing, you agree to the" -->
    By continuing, you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
  </p>

  <script>
    (function() {
      const input = document.getElementById('phone');
      const cta = document.getElementById('cta');
      const helper = document.getElementById('helper');
      const wrap = document.getElementById('phoneWrap');
      const networkBanner = document.getElementById('networkBanner');
      const networkText = document.getElementById('networkText');

      const qs = new URLSearchParams(location.search);
      if (qs.get('network') === 'error') {
        networkBanner.style.display = 'flex';
      }

      function formatPhone(value) {
        const digits = value.replace(/\D/g, '').slice(0, 8);
        if (digits.length <= 2) return digits;
        if (digits.length <= 4) return digits.slice(0, 2) + ' ' + digits.slice(2);
        if (digits.length <= 6) return digits.slice(0, 2) + ' ' + digits.slice(2, 4) + '-' + digits.slice(4);
        return digits.slice(0, 2) + ' ' + digits.slice(2, 4) + '-' + digits.slice(4, 6) + '-' + digits.slice(6);
      }

      let hasBlurred = false;

      function validate(showError) {
        const digits = input.value.replace(/\D/g, '');
        const valid = digits.length === 8 && digits.startsWith('6');
        cta.disabled = !valid || cta.dataset.loading === 'true';
        if (showError || (hasBlurred && digits.length > 0)) {
          helper.classList.toggle('error', !valid);
          helper.textContent = !valid && digits.length > 0
            ? 'Enter a number in the format +993 6X XX-XX-XX.'
            : 'Enter a Turkmenistan mobile number.';
          wrap.classList.toggle('has-error', !valid && digits.length > 0);
        } else {
          helper.classList.remove('error');
          helper.textContent = 'Enter a Turkmenistan mobile number.';
          wrap.classList.remove('has-error');
        }
        return valid;
      }

      input.addEventListener('input', (e) => {
        const start = input.selectionStart;
        const oldLen = input.value.length;
        const formatted = formatPhone(input.value);
        input.value = formatted;
        const newLen = formatted.length;
        const cursor = start + (newLen - oldLen);
        input.setSelectionRange(cursor, cursor);
        validate(false);
        if (networkBanner.style.display === 'flex') {
          networkBanner.style.display = 'none';
        }
      });

      input.addEventListener('blur', () => {
        hasBlurred = true;
        validate(true);
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text');
        let cleaned = paste.replace(/\D/g, '');
        if (cleaned.startsWith('993')) cleaned = cleaned.slice(3);
        const formatted = formatPhone(cleaned);
        input.value = formatted;
        input.dispatchEvent(new Event('input'));
      });

      cta.addEventListener('click', () => {
        const digits = input.value.replace(/\D/g, '');
        const phone = '+993' + digits;
        cta.dataset.loading = 'true';
        cta.disabled = true;
        cta.innerHTML = '<span class="spinner"></span>Sending…';
        setTimeout(() => {
          cta.dataset.loading = 'false';
          cta.disabled = false;
          cta.textContent = 'Get code';
          window.parent.postMessage({ action: 'navigate', to: 'otp', phone: phone }, '*');
        }, 1200);
      });

      setTimeout(() => input.focus(), 200);
    })();

    function closeAuth() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'close' }, '*');
        window.parent.postMessage({ action: 'navigate', to: 'close' }, '*');
      }
    }

    function setLang(btn) {
      document.querySelectorAll('.lang-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
