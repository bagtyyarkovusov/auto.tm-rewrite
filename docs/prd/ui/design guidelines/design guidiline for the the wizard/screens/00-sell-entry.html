<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Sell — AutoTM</title>
  <style>
    @font-face { font-family: 'UberMove'; src: url('../fonts/UberMoveBold.otf') format('opentype'); font-weight: 700; }
    @font-face { font-family: 'UberMove'; src: url('../fonts/UberMoveMedium.otf') format('opentype'); font-weight: 500; }
    @font-face { font-family: 'UberMoveText'; src: url('../fonts/UberMoveTextRegular.otf') format('opentype'); font-weight: 400; }
    @font-face { font-family: 'UberMoveText'; src: url('../fonts/UberMoveTextMedium.otf') format('opentype'); font-weight: 500; }
    @font-face { font-family: 'UberMoveText'; src: url('../fonts/UberMoveTextBold.otf') format('opentype'); font-weight: 700; }
    @font-face { font-family: 'UberMoveText'; src: url('../fonts/UberMoveTextLight.otf') format('opentype'); font-weight: 300; }
    @font-face { font-family: 'UberMoveMono'; src: url('../fonts/UberMoveMono-Regular.woff2') format('woff2'); font-weight: 400; }
    @font-face { font-family: 'UberMoveMono'; src: url('../fonts/UberMoveMono-Medium.woff2') format('woff2'); font-weight: 500; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding: 0 20px calc(24px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    .screen-title {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.02em;
      padding: calc(12px + env(safe-area-inset-top)) 0 20px;
    }

    .draft-card {
      border: 1px solid #e2e2e2;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .draft-thumb {
      width: 100%;
      height: 140px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4a4a4a 0%, #2a2a2a 50%, #1a1a1a 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .draft-thumb svg {
      width: 48px;
      height: 48px;
      stroke: rgba(255,255,255,0.25);
      stroke-width: 1.5;
      fill: none;
      position: relative;
      z-index: 1;
    }
    .draft-photo-count {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.65);
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      z-index: 1;
    }
    .draft-label {
      font-size: 12px;
      font-weight: 500;
      color: #afafaf;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .draft-title {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }
    .draft-meta {
      font-size: 14px;
      color: #4b4b4b;
      line-height: 1.4;
    }
    .draft-meta span { color: #afafaf; }

    .btn-primary {
      height: 52px;
      border-radius: 999px;
      border: none;
      background: #000000;
      color: #ffffff;
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: grid;
      place-items: center;
      width: 100%;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

    .btn-outline {
      height: 52px;
      border-radius: 999px;
      border: 1.5px solid #000000;
      background: #ffffff;
      color: #000000;
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: grid;
      place-items: center;
      width: 100%;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-outline:hover { background: #f3f3f3; }
    .btn-outline:active { transform: scale(0.98); }

    .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }

    .skeleton-card {
      height: 140px;
      border-radius: 12px;
      background: linear-gradient(90deg, #f3f3f3 25%, #e8e8e8 50%, #f3f3f3 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.2s ease-in-out infinite;
      margin-bottom: 16px;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <h1 class="screen-title">Sell</h1>

  <div id="draftSection">
    <div class="draft-card">
      <div class="draft-thumb">
        <svg viewBox="0 0 24 24"><path d="M5 17h14M6 17l1.5-4h9L18 17M8 13l-1-2.5A2 2 0 0 1 8.8 8h6.4a2 2 0 0 1 1.8 2.5L16 13M7 17v2M17 17v2"/></svg>
        <span class="draft-photo-count">8 photos</span>
      </div>
      <span class="draft-label">Latest draft</span>
      <div class="draft-title">2018 Toyota Camry</div>
      <div class="draft-meta">Saved 2 min ago <span>•</span> Price missing</div>
      <button class="btn-primary" onclick="openWizard('draft')">Continue draft</button>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-outline" onclick="openWizard('new')">New listing</button>
  </div>

  <script>
    (function() {
      const qs = new URLSearchParams(location.search);
      const state = qs.get('state');
      const draftSection = document.getElementById('draftSection');

      if (state === 'loading') {
        draftSection.innerHTML = '<div class="skeleton-card"></div>';
      } else if (state === 'empty') {
        draftSection.innerHTML = '';
      } else if (state === 'error') {
        draftSection.innerHTML = '<p style="font-size:14px;color:#F43F5E;margin-bottom:16px;">Could not load draft. Try again.</p>';
      }
    })();

    function openWizard(mode) {
      window.parent.postMessage({ action: 'navigate', to: 'wizard', mode: mode }, '*');
    }
  </script>
</body>
</html>
