
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoTM — Design System Gallery</title>
  <style>
    @font-face { font-family: 'UberMove'; src: url('fonts/UberMoveBold.otf') format('opentype'); font-weight: 700; }
    @font-face { font-family: 'UberMove'; src: url('fonts/UberMoveMedium.otf') format('opentype'); font-weight: 500; }
    @font-face { font-family: 'UberMoveText'; src: url('fonts/UberMoveTextRegular.otf') format('opentype'); font-weight: 400; }
    @font-face { font-family: 'UberMoveText'; src: url('fonts/UberMoveTextMedium.otf') format('opentype'); font-weight: 500; }
    @font-face { font-family: 'UberMoveText'; src: url('fonts/UberMoveTextBold.otf') format('opentype'); font-weight: 700; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      background: #f3f3f3;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* Page header */
    .page-header {
      text-align: center;
      padding: 48px 24px 32px;
    }
    .page-title {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .page-subtitle {
      font-size: 16px;
      color: #4b4b4b;
      line-height: 1.5;
    }

    /* Section */
    .flow-section {
      padding: 0 48px 48px;
    }
    .section-title {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    /* Device row */
    .frames-row {
      display: flex;
      flex-wrap: wrap;
      gap: 48px;
      justify-content: center;
      align-items: flex-start;
    }
    .device-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .device-label {
      font-size: 13px;
      font-weight: 500;
      color: #4b4b4b;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .device-label strong {
      color: #000000;
      font-weight: 600;
    }

    /* iPhone 15 Pro frame */
    .iphone {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
      flex-shrink: 0;
    }
    .iphone::before, .iphone::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .iphone::before { left: -1px; }
    .iphone::after  { right: -1px; }
    .dynamic-island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%) translateZ(0);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
      will-change: transform;
      backface-visibility: hidden;
    }
    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: #fafaf7;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #1a1916;
      pointer-events: none;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: currentColor; }
    .statusbar .battery { width: 25px; }
    .inner {
      flex: 1 1 auto;
      width: 100%;
      border: 0;
      background: #ffffff;
    }
    .home-indicator {
      flex: 0 0 28px;
      position: relative;
      pointer-events: none;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: #1a1916;
      border-radius: 999px;
      opacity: 0.85;
    }

    /* Android frame */
    .android {
      position: relative;
      width: 412px;
      height: 900px;
      border-radius: 36px;
      background: #1a1a1a;
      padding: 12px;
      box-shadow:
        0 0 0 2px #333 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }
    .android-screen {
      width: 100%; height: 100%;
      border-radius: 28px;
      overflow: hidden;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .android-screen iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }
    .punch-hole {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #000000;
      border-radius: 50%;
      z-index: 10;
    }
    .android-nav {
      flex: 0 0 48px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid #e2e2e2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 80px;
      z-index: 10;
      border-radius: 0 0 28px 28px;
    }
    .android-nav-pill {
      width: 108px;
      height: 4px;
      background: #000000;
      border-radius: 999px;
    }

    /* Mini device strip */
    .steps-strip {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 24px 0 48px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .mini-wrap {
      flex: 0 0 auto;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .mini-label {
      font-size: 12px;
      font-weight: 500;
      color: #4b4b4b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .mini-device {
      width: 390px;
      height: 844px;
      border-radius: 56px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      padding: 12px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 16px 40px -8px rgba(0,0,0,0.35);
      transform: scale(0.42);
      transform-origin: top center;
    }
    .mini-device .screen { border-radius: 44px; }
    .mini-device .dynamic-island {
      width: 110px;
      height: 32px;
    }
    .mini-device .home-indicator::after {
      width: 120px;
      height: 4px;
    }

    /* Tweaks panel */
    .tweaks {
      margin-top: 24px;
      background: #ffffff;
      border: 1px solid #e2e2e2;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: rgba(0,0,0,0.12) 0px 4px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }
    .tweaks h3 {
      font-family: 'UberMove', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tweak-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 14px;
      color: #4b4b4b;
    }
    .tweak-row label { font-weight: 500; }
    .toggles {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .toggle {
      font-family: 'UberMoveText', system-ui, Helvetica Neue, Helvetica, Arial, sans-serif;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #e2e2e2;
      background: #ffffff;
      font-size: 12px;
      font-weight: 500;
      color: #4b4b4b;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .toggle.active {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }
    .toggle:hover:not(.active) { background: #f3f3f3; }
    .toggle:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 900px) {
      .flow-section { padding: 0 16px 32px; }
      .frames-row { gap: 24px; }
      .page-header { padding: 24px 16px 20px; }
      .page-title { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">AutoTM Design System Gallery</h1>
    <p class="page-subtitle">Uber design system — Auth flow + Create listing wizard</p>
  </div>

  <!-- Auth Flow -->
  <section class="flow-section" id="authFlow">
    <h2 class="section-title">Auth Flow</h2>
    <div class="frames-row">

          <div class="screen">

                <svg viewBox="0 0 17 11" aria-hidden><rect x="0"  y="7" width="3" height="4" rx="0.6"/><rect x="4"  y="5" width="3" height="6" rx="0.6"/><rect x="8"  y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
                <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
                <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>

      <div class="device-wrap">
        <span class="device-label"><strong>Screen 2</strong> — OTP entry</span>
        <div class="iphone">
          <span class="btn-rail left-1" aria-hidden></span>
          <span class="btn-rail left-2" aria-hidden></span>
          <span class="btn-rail left-3" aria-hidden></span>
          <span class="btn-rail right-1" aria-hidden></span>
          <span class="dynamic-island" aria-hidden></span>
          <div class="screen">
            <div class="statusbar">
              <span>9:41</span>
              <span class="right">
                <svg viewBox="0 0 17 11" aria-hidden><rect x="0"  y="7" width="3" height="4" rx="0.6"/><rect x="4"  y="5" width="3" height="6" rx="0.6"/><rect x="8"  y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
                <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
                <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
              </span>
            </div>
            <iframe class="inner" id="otpFrame" src="screens/02-otp.html?phone=%2B99361234567" title="OTP entry"></iframe>
            <div class="home-indicator" aria-hidden></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tweaks">
      <h3>OTP State Toggles</h3>
      <div class="tweak-row">
        <label>Status</label>
        <div class="toggles">
          <button class="toggle active" data-key="status" data-val="default" onclick="setOtpStatus('default')">Default</button>
          <button class="toggle" data-key="status" data-val="error" onclick="setOtpStatus('error')">Error</button>
          <button class="toggle" data-key="status" data-val="loading" onclick="setOtpStatus('loading')">Loading</button>
        </div>
      </div>
      <div class="tweak-row">
        <label>Resend</label>
        <div class="toggles">
          <button class="toggle active" data-key="resend" data-val="countdown" onclick="setOtpResend('countdown')">Countdown</button>
          <button class="toggle" data-key="resend" data-val="ready" onclick="setOtpResend('ready')">Ready</button>
        </div>

      <div class="tweak-row">
        <label>Prefill</label>
        <div class="toggles">
          <button class="toggle active" data-key="prefill" data-val="none" onclick="setOtpPrefill('')">Empty</button>
          <button class="toggle" data-key="prefill" data-val="123456" onclick="setOtpPrefill('123456')">123456</button>
          <button class="toggle" data-key="prefill" data-val="dev" onclick="setOtpPrefill('dev')">Dev pill</button>
        </div>
      </div>

  <!-- Create Listing Wizard -->
  <section class="flow-section" id="wizardFlow">
    <h2 class="section-title">Create Listing Wizard</h2>
    <div class="frames-row">
      <div class="device-wrap">
        <span class="device-label"><strong>iPhone 15 Pro</strong> — iOS</span>
        <div class="iphone">
          <span class="btn-rail left-1" aria-hidden></span>
          <span class="btn-rail left-2" aria-hidden></span>
          <span class="btn-rail left-3" aria-hidden></span>
          <span class="btn-rail right-1" aria-hidden></span>
          <span class="dynamic-island" aria-hidden></span>
          <div class="screen">
            <div class="statusbar">
              <span>9:41</span>
              <span class="right">
                <svg viewBox="0 0 17 11" aria-hidden><rect x="0"  y="7" width="3" height="4" rx="0.6"/><rect x="4"  y="5" width="3" height="6" rx="0.6"/><rect x="8"  y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
                <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
                <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
              </span>
            </div>
            <iframe class="inner" id="wizardIos" src="screens/00-sell-entry.html" title="Wizard iOS"></iframe>
            <div class="home-indicator" aria-hidden></div>
          </div>
        </div>
      </div>

      <div class="device-wrap">
        <span class="device-label"><strong>Android Pixel</strong> — Material</span>
        <div class="android">
          <div class="punch-hole"></div>
          <div class="android-screen">
            <iframe id="wizardAndroid" src="screens/00-sell-entry.html" title="Wizard Android"></iframe>
            <div class="android-nav"><div class="android-nav-pill"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tweaks">
      <h3>Wizard Step Navigation</h3>
      <div class="tweak-row">
        <label>Step</label>
        <div class="toggles">
          <button class="toggle active" onclick="goToWizard('sell')">Sell</button>
          <button class="toggle" onclick="goToWizard('vin')">1 VIN</button>
          <button class="toggle" onclick="goToWizard('photos')">2 Photos</button>
          <button class="toggle" onclick="goToWizard('vehicle')">3 Vehicle</button>
          <button class="toggle" onclick="goToWizard('specs')">4 Specs</button>
          <button class="toggle" onclick="goToWizard('price')">5 Price</button>

          <button class="toggle" onclick="goToWizard('description')">7 Desc</button>

  <!-- All Steps Strip -->
  <section class="flow-section" id="allSteps">
    <h2 class="section-title">All Wizard Steps</h2>
    <div class="steps-strip" id="stepsStrip">
      <!-- Populated by JS -->
    </div>
  </section>

  <script>
    /* ─── OTP state management ─── */
    (function() {
      const otpFrame = document.getElementById('otpFrame');
      let status = 'default';
      let resend = 'countdown';
      let prefill = '';
      let devCode = '';

      function updateOtpFrame() {
        const params = new URLSearchParams();
        params.set('phone', '+99361234567');
        if (status === 'error') params.set('error', 'true');
        if (status === 'loading') params.set('loading', 'true');
        if (resend === 'ready') params.set('resend', 'ready');
        if (prefill) params.set('filled', prefill);
        if (devCode) params.set('devCode', devCode);
        otpFrame.src = 'screens/02-otp.html?' + params.toString();
      }

      function setActiveOtp(key, val) {
        document.querySelectorAll('.toggle[data-key="' + key + '"]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.val === val);
        });
      }

      window.setOtpStatus = function(s) {
        status = s;
        setActiveOtp('status', s);
        updateOtpFrame();
      };
      window.setOtpResend = function(r) {
        resend = r;
        setActiveOtp('resend', r);
        updateOtpFrame();
      };
      window.setOtpPrefill = function(p) {
        if (p === 'dev') {
          prefill = '';
          devCode = '123456';
          setActiveOtp('prefill', 'dev');
        } else {
          prefill = p;
          devCode = '';
          setActiveOtp('prefill', p || 'none');
        }
        updateOtpFrame();
      };

      window.addEventListener('message', function(e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.action === 'navigate' && e.data.to === 'otp' && e.data.phone) {
          const params = new URLSearchParams();
          params.set('phone', e.data.phone);
          if (status === 'error') params.set('error', 'true');
          if (status === 'loading') params.set('loading', 'true');
          if (resend === 'ready') params.set('resend', 'ready');
          if (prefill) params.set('filled', prefill);
          if (devCode) params.set('devCode', devCode);
          otpFrame.src = 'screens/02-otp.html?' + params.toString();
        }
      });
    })();

    /* ─── Wizard navigation ─── */
    const WIZARD_ROUTES = {
      'sell': 'screens/00-sell-entry.html',
      'vin': 'screens/01-vin.html',
      'photos': 'screens/02-photos.html',
      'vehicle': 'screens/03-vehicle.html',
      'specs': 'screens/04-specs.html',
      'price': 'screens/05-price.html',
      'location': 'screens/06-location.html',
      'description': 'screens/07-description.html',
      'review': 'screens/08-review.html',
      'discard': 'screens/09-discard.html',
    };

    const wizardIos = document.getElementById('wizardIos');
    const wizardAndroid = document.getElementById('wizardAndroid');

    function goToWizard(screen) {
      const path = WIZARD_ROUTES[screen];
      if (!path) return;
      wizardIos.src = path;
      wizardAndroid.src = path;
      document.querySelectorAll('#wizardFlow .toggle').forEach(t => t.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.action === 'navigate') {
        const map = {
          'sell-entry': 'sell',
          'wizard': 'vin',
          'step1-vin': 'vin',
          'step2-photos': 'photos',
          'step3-vehicle': 'vehicle',
          'step4-specs': 'specs',
          'step5-price': 'price',
          'step6-location': 'location',
          'step7-description': 'description',
          'step8-review': 'review',
          'discard': 'review',
          'back': 'review',
          'published': 'sell',
        };
        const target = map[e.data.to] || e.data.to;
        const path = WIZARD_ROUTES[target];
        if (path) {
          wizardIos.src = path;
          wizardAndroid.src = path;
          document.querySelectorAll('#wizardFlow .toggle').forEach(t => t.classList.remove('active'));
          const label = Object.keys(WIZARD_ROUTES).find(k => WIZARD_ROUTES[k] === path);
          const btns = document.querySelectorAll('#wizardFlow .toggle');
          btns.forEach(btn => {
            if (label === 'sell' && btn.textContent === 'Sell') btn.classList.add('active');
            else if (label === 'vin' && btn.textContent === '1 VIN') btn.classList.add('active');
            else if (label === 'photos' && btn.textContent === '2 Photos') btn.classList.add('active');
            else if (label === 'vehicle' && btn.textContent === '3 Vehicle') btn.classList.add('active');
            else if (label === 'specs' && btn.textContent === '4 Specs') btn.classList.add('active');
            else if (label === 'price' && btn.textContent === '5 Price') btn.classList.add('active');
            else if (label === 'location' && btn.textContent === '6 Location') btn.classList.add('active');
            else if (label === 'description' && btn.textContent === '7 Desc') btn.classList.add('active');
            else if (label === 'review' && btn.textContent === '8 Review') btn.classList.add('active');
            else if (label === 'discard' && btn.textContent === 'Discard') btn.classList.add('active');
          });
        }
      }
    });

    /* ─── Build mini steps strip ─── */
    (function() {
      const strip = document.getElementById('stepsStrip');
      const steps = [
        { key: 'sell', label: 'Sell', path: 'screens/00-sell-entry.html' },
        { key: 'vin', label: '1 VIN', path: 'screens/01-vin.html' },
        { key: 'photos', label: '2 Photos', path: 'screens/02-photos.html' },
        { key: 'vehicle', label: '3 Vehicle', path: 'screens/03-vehicle.html' },
        { key: 'specs', label: '4 Specs', path: 'screens/04-specs.html' },
        { key: 'price', label: '5 Price', path: 'screens/05-price.html' },
        { key: 'location', label: '6 Location', path: 'screens/06-location.html' },
        { key: 'description', label: '7 Desc', path: 'screens/07-description.html' },
        { key: 'review', label: '8 Review', path: 'screens/08-review.html' },
        { key: 'discard', label: 'Discard', path: 'screens/09-discard.html' },
      ];

      steps.forEach((step, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'mini-wrap';
        wrap.innerHTML = `
          <div class="mini-device iphone">
            <span class="dynamic-island" aria-hidden></span>
            <div class="screen">
              <iframe class="inner" src="${step.path}" loading="lazy" title="${step.label}"></iframe>
              <div class="home-indicator" aria-hidden></div>
            </div>
          </div>
          <span class="mini-label">${step.label}</span>
        `;
        strip.appendChild(wrap);
      });
    })();
  </script>
</body>
</html>
