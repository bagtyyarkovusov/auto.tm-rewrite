name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, tm-proxy]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @auto-tm/db generate

      - run: pnpm check:glossary

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The reviewer-flow smoke's pure helpers (base32, TOTP, formatting). The
      # smoke itself needs a deployed environment and credentials, so it is an
      # operator command, not a CI step. Kept out of `pnpm test` because
      # ADR-0042's glossary check pins that script's exact contents.
      - run: pnpm test:reviewer-flow-smoke

      - run: pnpm build
