name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, tm-proxy]
    env:
      # Safe unreachable defaults override any endpoints inherited from the
      # runner. The service step replaces them with this run's mapped ports.
      DATABASE_URL: postgresql://auto_tm_ci:auto_tm_ci_pass@127.0.0.1:1/auto_tm_ci
      REDIS_URL: redis://127.0.0.1:1
      MINIO_ENDPOINT: http://127.0.0.1:1
      MINIO_PUBLIC_URL: http://127.0.0.1:1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # "docs" only when every file changed since the previous push to main is
      # Markdown or under docs/. Steps below run on anything else, including
      # a previous commit that cannot be fetched.
      - name: Choose the CI lane
        id: lane
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          node scripts/ci-lane.mjs "$BEFORE"

      - name: Start disposable test services
        if: steps.lane.outputs.lane != 'docs'
        shell: bash
        run: bash scripts/ci-services.sh up

      # Actions does not expand $HOME in `env:`, so the shell sets the store.
      # pnpm 9 and 10 read npm_config_*; later pnpm reads only pnpm_config_*.
      - name: Use the persistent pnpm store
        shell: bash
        run: |
          store_dir="$HOME/Library/pnpm/store"
          echo "npm_config_store_dir=$store_dir" >> "$GITHUB_ENV"
          echo "pnpm_config_store_dir=$store_dir" >> "$GITHUB_ENV"

      # Diagnostic only; kept on purpose (see .github/workflows/README.md).
      - name: Report dependency cache state
        shell: bash
        continue-on-error: true
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          store_path="$(pnpm store path --silent)" || store_path="(unavailable)"
          echo "pnpm store: $store_path"
          case "$store_path" in
            "$HOME/Library/pnpm/store"*) ;;
            *) echo "::warning::pnpm store is $store_path, not $HOME/Library/pnpm/store; installs may be cold" ;;
          esac
          avail_kib="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          if [ "${avail_kib:-0}" -lt 10485760 ]; then
            echo "::warning::Less than 10 GiB free on the runner volume; see the pnpm store section of .github/workflows/README.md"
          fi
          if [ -d "$store_path" ]; then
            ls -ld "$store_path"
            df -h "$store_path"
          elif [ "$store_path" = "(unavailable)" ]; then
            df -h .
          else
            echo "pnpm store does not exist yet"
            df -h .
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:glossary

      - run: pnpm test:ci-lane

      - name: Docs checks
        if: steps.lane.outputs.lane == 'docs'
        run: pnpm test:agent-docs && pnpm test:glossary

      - if: steps.lane.outputs.lane != 'docs'
        run: pnpm --filter @auto-tm/db generate

      - name: Deploy migrations to the disposable database
        if: steps.lane.outputs.lane != 'docs'
        run: pnpm db:migrate:deploy

      - name: Create disposable media buckets
        if: steps.lane.outputs.lane != 'docs'
        run: pnpm minio:bootstrap

      - if: steps.lane.outputs.lane != 'docs'
        run: pnpm lint

      - if: steps.lane.outputs.lane != 'docs'
        run: pnpm typecheck

      - if: steps.lane.outputs.lane != 'docs'
        run: pnpm test
        env:
          NODE_ENV: test
          APP_ENV: test

      # The reviewer-flow smoke's pure helpers (base32, TOTP, formatting). The
      # smoke itself needs a deployed environment and credentials, so it is an
      # operator command, not a CI step. Kept out of `pnpm test` because
      # ADR-0042's glossary check pins that script's exact contents.
      - if: steps.lane.outputs.lane != 'docs'
        run: pnpm test:reviewer-flow-smoke

      - if: steps.lane.outputs.lane != 'docs'
        run: pnpm build

      - name: Show test service logs on failure
        if: ${{ failure() && steps.lane.outputs.lane != 'docs' }}
        shell: bash
        run: bash scripts/ci-services.sh logs

      - name: Remove disposable test services
        if: ${{ always() && steps.lane.outputs.lane != 'docs' }}
        shell: bash
        run: bash scripts/ci-services.sh down
