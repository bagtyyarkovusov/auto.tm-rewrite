name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  pr:
    runs-on: [self-hosted, tm-proxy]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @auto-tm/db generate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
