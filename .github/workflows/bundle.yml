name: Bundle

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: [self-hosted, tm-proxy]
    env:
      npm_config_store_dir: ${HOME}/Library/pnpm/store

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report dependency cache state
        shell: bash
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          store_path="$(pnpm store path --silent)"
          echo "pnpm store: $store_path"
          if [ -d "$store_path" ]; then
            ls -ld "$store_path"
            df -h "$store_path"
          else
            echo "pnpm store does not exist yet"
            df -h .
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @auto-tm/db generate

      - run: make bundle TAG=${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: auto-tm-${{ github.ref_name }}
          path: images/auto-tm-${{ github.ref_name }}.tar.gz
          retention-days: 90
