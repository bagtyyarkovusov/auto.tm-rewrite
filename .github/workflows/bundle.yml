name: Bundle

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: [self-hosted, tm-proxy]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @auto-tm/db generate

      - run: make bundle TAG=${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: auto-tm-${{ github.ref_name }}
          path: images/auto-tm-${{ github.ref_name }}.tar.gz
          retention-days: 90
