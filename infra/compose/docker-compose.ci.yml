services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auto_tm_ci
      POSTGRES_PASSWORD: auto_tm_ci_pass
      POSTGRES_DB: auto_tm_ci
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto_tm_ci -d auto_tm_ci"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - target: 6379
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # The dev variant supplies the shell and wget used by this health check.
    image: cgr.dev/chainguard/minio@sha256:8d5a0265f0e18fb3b29f95598147f1cc2a86b782181668bad176b0e90cce9569
    # Preserve writable /data volumes created by the previous root-running image.
    user: "0:0"
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - target: 9000
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:
